<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harness · 节点与类型库</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --page-bg:#14161b;--page-panel:#1b1e25;--page-panel2:#222630;--page-line:#2d313b;--page-line2:#3a3f4b;
  --page-text:#e6e4df;--page-muted:#8b8f98;--page-amber:#f0a83c;--page-teal:#5bb8a9;--page-red:#e5646a;
  --page-sans:'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif;
  --page-mono:'JetBrains Mono',Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--page-bg);color:var(--page-text);font-family:var(--page-sans);font-size:14px;overflow:hidden}
button,select,input,textarea{font-family:inherit;font-size:13px}
button{cursor:pointer}
.app{display:flex;flex-direction:column;height:100vh}
.top{height:48px;flex:none;border-bottom:1px solid var(--page-line);display:flex;align-items:center;gap:14px;padding:0 18px;background:#111317}
.top .br{font-weight:700}
.top .br span{color:var(--page-muted);font-weight:400}
.top a{color:var(--page-muted);text-decoration:none;font-size:13px}
.top a:hover{color:var(--page-text)}
.sp{flex:1}
.desc{flex:none;padding:8px 18px;color:var(--page-muted);font-size:13px;border-bottom:1px solid var(--page-line)}
.desc b{color:var(--page-text);font-weight:500}
.bar2{flex:none;display:flex;align-items:center;gap:6px;padding:0 18px;border-bottom:1px solid var(--page-line);height:42px}
.tab{background:none;border:none;border-bottom:2px solid transparent;color:var(--page-muted);padding:10px 12px 9px;font-size:14px}
.tab.on{color:var(--page-text);border-bottom-color:var(--page-amber)}
.lvl{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--page-muted)}
.lvl select{background:var(--page-panel);border:1px solid var(--page-line2);color:var(--page-amber);padding:4px 6px}
.btn{background:var(--page-panel2);color:var(--page-text);border:1px solid var(--page-line2);padding:5px 12px}
.btn:hover{border-color:var(--page-muted)}
.btn.pri{background:var(--page-amber);color:#1a1a1a;border-color:var(--page-amber);font-weight:500}
.btn.ok{border-color:var(--page-teal);color:var(--page-teal)}
.btn.bad{border-color:var(--page-red);color:var(--page-red)}
.btn.sm{padding:3px 9px;font-size:12px}
.btn:disabled{opacity:.4;cursor:default}
.work{flex:1;display:grid;grid-template-columns:240px 1fr 300px;min-height:0}
.work>*{min-width:0;min-height:0;overflow-y:auto}
.left{border-right:1px solid var(--page-line);padding:6px 0}
.mid{padding:18px 24px 40px}
.right{border-left:1px solid var(--page-line);padding:14px;background:#16181d}
.grp{font-family:var(--page-mono);font-size:11px;color:var(--page-muted);padding:12px 14px 4px}
.it{display:flex;justify-content:space-between;align-items:center;gap:6px;width:100%;text-align:left;background:none;border:none;border-left:2px solid transparent;color:var(--page-text);padding:5px 14px;font-size:13.5px}
.it:hover{background:var(--page-panel)}
.it.on{border-left-color:var(--page-amber);background:var(--page-panel);color:var(--page-amber)}
.it small{font-family:var(--page-mono);font-size:10.5px;color:var(--page-muted)}
.it.tmp small{color:var(--page-amber)}
h2{margin:0 0 2px;font-size:22px}
.sub{color:var(--page-muted);margin:0 0 16px;font-size:13.5px}
.kv{font-family:var(--page-mono);font-size:11.5px;color:var(--page-teal)}
.sec{margin:20px 0 8px;font-family:var(--page-mono);font-size:11.5px;color:var(--page-muted);display:flex;align-items:center;gap:10px}
.sec::after{content:'';flex:1;height:1px;background:var(--page-line)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:500;color:var(--page-muted);font-size:12px;padding:6px 8px;border-bottom:1px solid var(--page-line2)}
td{padding:6px 8px;border-bottom:1px solid var(--page-line);vertical-align:top}
td.m{font-family:var(--page-mono);font-size:12.5px}
tr.klock td{background:rgba(240,168,60,.06)}
.bdg{display:inline-block;font-family:var(--page-mono);font-size:10.5px;padding:0 6px;border:1px solid var(--page-line2);color:var(--page-muted);margin:1px 3px 1px 0;white-space:nowrap}
.bdg.k{border-color:var(--page-amber);color:var(--page-amber)}
.bdg.d{border-color:var(--page-teal);color:var(--page-teal)}
.bdg.n{color:#6b707c}
.bdg.r{border-color:var(--page-red);color:var(--page-red)}
.bdg.y{background:var(--page-amber);color:#1a1a1a;border-color:var(--page-amber)}
.ports{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.ports>*{min-width:0}
.port{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--page-line);font-family:var(--page-mono);font-size:12.5px;flex-wrap:wrap}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.dot.i{background:var(--page-teal)}.dot.o{background:var(--page-amber)}
.tv{color:var(--page-amber)}
.locks{border-left:3px solid var(--page-amber);background:var(--page-panel);padding:8px 12px;font-size:13px}
.locks div{padding:2px 0}
.meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--page-line);border:1px solid var(--page-line)}
.meta>div{background:var(--page-panel);padding:8px 10px;min-width:0}
.meta label{display:block;font-family:var(--page-mono);font-size:10.5px;color:var(--page-muted)}
.meta span{font-family:var(--page-mono);font-size:12.5px;word-break:break-all}
.seg{display:inline-flex;border:1px solid var(--page-line2)}
.seg button{background:none;border:none;color:var(--page-muted);padding:4px 12px;font-size:12.5px}
.seg button.on{background:var(--page-panel2);color:var(--page-text)}
pre.y{background:#101216;border:1px solid var(--page-line);padding:12px 14px;font-family:var(--page-mono);font-size:12.5px;line-height:1.6;overflow:auto;margin:0;color:#cfd2d8;white-space:pre}
pre.y .c{color:#6b707c}.pre .k{color:var(--page-teal)}
.chain{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:var(--page-mono);font-size:12.5px}
.chain span{border:1px solid var(--page-line2);padding:2px 8px}
.chain span.cur{border-color:var(--page-amber);color:var(--page-amber)}
.chain i{color:var(--page-muted);font-style:normal}
.vers div{display:grid;grid-template-columns:70px 1fr;gap:10px;padding:5px 0;border-bottom:1px solid var(--page-line);font-size:13px}
.vers b{font-family:var(--page-mono);font-weight:400;color:var(--page-teal)}
/* compat */
.cmp{display:grid;grid-template-columns:1fr 60px 1fr;gap:14px;align-items:center;margin:8px 0 18px}
.cmp>*{min-width:0}
.cmp label{display:block;font-family:var(--page-mono);font-size:11px;color:var(--page-muted);margin-bottom:4px}
.cmp select{width:100%;background:var(--page-panel);border:1px solid var(--page-line2);color:var(--page-text);padding:8px;font-family:var(--page-mono);font-size:13px}
.arrow{text-align:center;color:var(--page-muted);font-family:var(--page-mono);padding-top:16px}
.verdict{border:1px solid var(--page-line2);padding:16px 18px;background:var(--page-panel)}
.verdict .vh{font-size:20px;font-weight:700;margin-bottom:6px}
.verdict.yes{border-color:var(--page-teal)}.verdict.yes .vh{color:var(--page-teal)}
.verdict.warn{border-color:var(--page-amber)}.verdict.warn .vh{color:var(--page-amber)}
.verdict.no{border-color:var(--page-red)}.verdict.no .vh{color:var(--page-red)}
.verdict ol{margin:6px 0 0;padding-left:20px;color:var(--page-muted);line-height:1.8}
.verdict ol b{color:var(--page-text);font-weight:500}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.rules td:first-child{white-space:nowrap;font-weight:500}
/* packages */
.pk{display:flex;justify-content:space-between;gap:10px;align-items:center}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.cols3>div{border:1px solid var(--page-line);background:var(--page-panel);padding:10px 12px;min-width:0}
.cols3 h5{margin:0 0 6px;font-family:var(--page-mono);font-weight:400;font-size:11px;color:var(--page-muted)}
.cols3 div div{font-size:13px;padding:2px 0}
/* wizard */
.steps{display:flex;gap:0;margin:6px 0 16px;border:1px solid var(--page-line)}
.steps div{flex:1;padding:8px 12px;font-size:13px;color:var(--page-muted);border-right:1px solid var(--page-line)}
.steps div:last-child{border-right:none}
.steps div.on{color:var(--page-text);background:var(--page-panel2);box-shadow:inset 0 -2px 0 var(--page-amber)}
.steps div.done{color:var(--page-teal)}
.impls{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.impl{background:var(--page-panel);border:1px solid var(--page-line2);color:var(--page-text);padding:12px;text-align:left;min-width:0}
.impl b{display:block;font-family:var(--page-mono);font-size:14px;margin-bottom:4px}
.impl span{font-size:12px;color:var(--page-muted)}
.impl.on{border-color:var(--page-amber)}
.impl.on b{color:var(--page-amber)}
.frm{display:grid;grid-template-columns:140px 1fr;gap:8px 14px;align-items:start}
.frm label{font-family:var(--page-mono);font-size:12px;color:var(--page-muted);padding-top:7px}
.frm input,.frm textarea{width:100%;background:#101216;border:1px solid var(--page-line2);color:var(--page-text);padding:6px 8px;font-family:var(--page-mono);font-size:12.5px;outline:none}
.frm textarea{height:70px;resize:vertical}
.frm input:focus,.frm textarea:focus{border-color:var(--page-muted)}
.chk div{padding:5px 0;font-size:13px;border-bottom:1px solid var(--page-line);display:flex;gap:8px}
.chk .ok{color:var(--page-teal)}.chk .er{color:var(--page-red)}.chk .wn{color:var(--page-amber)}
.wbtns{display:flex;gap:8px;margin-top:16px}
/* right */
.rh{font-family:var(--page-mono);font-size:11px;color:var(--page-muted);margin:14px 0 6px}
.rh:first-child{margin-top:0}
.lvbox{border:1px solid var(--page-line2);padding:10px 12px;font-size:13px;line-height:1.6}
.lvbox b{color:var(--page-amber);font-size:15px}
.draft{border:1px dashed var(--page-amber);background:var(--page-panel);padding:10px 12px;margin-bottom:10px;font-size:13px}
.draft.tmp{border-style:solid;border-color:var(--page-line2)}
.draft.done{border-style:solid;border-color:var(--page-teal);opacity:.75}
.draft.rej{border-style:solid;border-color:var(--page-line);opacity:.5}
.draft .dh{display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.draft .dh b{font-family:var(--page-mono);font-weight:600}
.draft .why{color:var(--page-muted);margin:6px 0;font-size:12.5px;line-height:1.6}
.draft .acts{display:flex;gap:6px;flex-wrap:wrap}
.empty{color:#6b707c;font-size:12.5px}
.alog div{font-size:12px;padding:4px 0;border-bottom:1px solid var(--page-line);color:var(--page-muted);line-height:1.5}
.alog div b{font-weight:500;color:var(--page-text)}
.alog div .who{font-family:var(--page-mono);font-size:10.5px;padding:0 4px;border:1px solid var(--page-line2);margin-right:4px}
.alog div .who.m{border-color:var(--page-amber);color:var(--page-amber)}
.narr{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--page-panel2);border:1px solid var(--page-amber);padding:10px 16px;font-size:13.5px;max-width:640px;z-index:20;display:none;box-shadow:0 6px 24px rgba(0,0,0,.4)}
.narr b{color:var(--page-amber);font-family:var(--page-mono);margin-right:8px}
.hl{animation:hl 1.4s ease-out}
@keyframes hl{0%{box-shadow:0 0 0 4px rgba(240,168,60,.6)}100%{box-shadow:0 0 0 0 rgba(240,168,60,0)}}
@media (max-width:1100px){.work{grid-template-columns:200px 1fr}.right{display:none}.impls{grid-template-columns:repeat(3,minmax(0,1fr))}.meta{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <span class="br">Harness · <span>节点与类型库</span></span>
    <span class="sp"></span>
    <a href="index.html">← 返回总览</a>
  </div>
  <div class="desc">这个工作域定义<b>积木本身和凸点规格</b>：13 个通用原子节点、端口类型库、扩展包和自定义节点。模型可以起草新类型、新节点，按授权档位进入待审批或临时命名空间。</div>
  <div class="bar2">
    <button class="tab on" data-tab="nodes">节点库</button>
    <button class="tab" data-tab="types">类型库</button>
    <button class="tab" data-tab="compat">兼容性检查</button>
    <button class="tab" data-tab="pkgs">扩展包</button>
    <span class="sp"></span>
    <span class="lvl">模型授权档位
      <select id="lvl">
        <option value="0">0 只读</option><option value="1" selected>1 建议</option><option value="2">2 部分授权</option><option value="3">3 高度授权</option><option value="4">4 完全授权</option>
      </select>
    </span>
    <button class="btn pri" id="demo">演示脚本</button>
  </div>
  <div class="work">
    <div class="left" id="left"></div>
    <div class="mid" id="mid"></div>
    <div class="right" id="right">
      <div class="rh">当前档位</div>
      <div class="lvbox" id="lvbox"></div>
      <div class="rh">模型起草 · 待处理</div>
      <div id="drafts"><div class="empty">暂无。在类型库或扩展包页点「让模型起草」。</div></div>
      <div class="rh">活动记录</div>
      <div class="alog" id="alog"></div>
    </div>
  </div>
</div>
<div class="narr" id="narr"></div>

<script>
/* ================= 数据 ================= */
const NODES = [
 {name:'资源',cat:'资源',kind:'atomic',impl:'builtin',
  in:[],out:[['ref','资源引用<T>','T = kind']],
  params:[['kind','资源类型引用','模型','模型/提示词/列表/常量/自定义','none',false],['source','枚举','inline','inline/library/file/url','none',true],['value','<kind 对应 schema>','—','随 kind 切换表单','none',true],['pin','枚举','snapshot','snapshot/link','none',false]],
  locks:[]},
 {name:'Agent',cat:'智能体',kind:'atomic',impl:'builtin',
  in:[['context','上下文包@1','必填'],['model','资源引用<模型>','必填'],['prompt','资源引用<提示词>','必填'],['tools','工具端点','可多连']],out:[['result','T','T = output_schema']],
  params:[['output_schema','类型引用','—','必填','none',true],['output_mode','枚举','single','single/list/stream','none',false],['lifecycle','枚举','ephemeral','ephemeral/resident','none',false],['limits','字典','{tool_calls:10, inner_turns:5}','tool_calls 1–50','def',true],['repair','策略引用','内置/自动修复+重试2次','—','none',false],['memory_policy','策略引用?','—','resident 时生效','none',false],['sampling','字典?','—','覆盖温度、种子','none',true]],
  locks:['context 端口只接受 上下文包，不能直接连账本或上游原文']},
 {name:'上下文装配',cat:'状态',kind:'atomic',impl:'builtin',
  in:[['in_*','任意','动态插口'],['target_model','资源引用<模型>','必填'],['summarizer','资源引用<模型>?','可选']],out:[['context','上下文包@1',''],['dropped','列表[指针]','']],
  params:[['recipe','配方引用 | 内联配方','—','必填','none',true],['budget','字典','{ratio:0.1, max_ratio:0.5}','ratio 0.01–0.5','def',true],['on_overflow','枚举','pointer','pointer/summarize/truncate/reject','none',false],['honor_inherit','布尔','true','—','kernel',false]],
  locks:['类型里标了 inherit 的字段必须透传（honor_inherit）']},
 {name:'工具',cat:'工具',kind:'atomic',impl:'builtin',
  in:[['request','工具请求<tool>','direct 模式必填']],out:[['endpoint','工具端点','endpoint 模式'],['result','工具结果<tool>','direct 模式']],
  params:[['tool','工具引用','—','内置 / MCP / HTTP / 脚本','none',false],['mode','枚举','endpoint','endpoint/direct','none',false],['config','<tool 对应 schema>','—','—','none',true],['risk','枚举','<注册等级>','L0–L3，只能调高','kernel',false],['policies','列表[策略引用]','[]','限流/白名单/审核/脱敏','none',false],['keep_pointer','布尔','true','—','kernel',false]],
  locks:['风险等级只能调高','必须保留原文指针','L3 工具前必须接人工节点']},
 {name:'扇出',cat:'拓扑',kind:'atomic',impl:'builtin',
  in:[['items','列表[T]','与 n 二选一'],['n','整数','与 items 二选一'],['shared_*','任意','动态插口']],out:[['results','列表[U]','U = body 出口类型'],['meta','运行统计','']],
  params:[['body','子图引用 | 内联子图','—','必填','none',false],['concurrency','整数','4','1–64','def',true],['isolation','布尔','true','—','none',true],['vary','字典<参数路径, 值列表>','{}','可改 body 中任意参数','none',true],['collect','汇合策略','{wait:all, on_fail:skip}','—','none',false],['budget_split','枚举','equal','equal/weighted/on_demand','none',false]],
  locks:[]},
 {name:'汇合',cat:'拓扑',kind:'atomic',impl:'builtin',
  in:[['in_*','任意','动态插口，至少 2']],out:[['collected','列表[T] | 元组 | 字典',''],['meta','运行统计','']],
  params:[['shape','枚举','list','list/tuple/dict','none',false],['wait','枚举','all','all/k_of_n/first/timeout','none',true],['k','整数','2','≥1','none',true],['timeout','时长','300s','—','none',true],['on_fail','枚举','skip','skip/retry/fail/default_value','none',false]],
  locks:[]},
 {name:'聚合',cat:'聚合',kind:'atomic',impl:'builtin',
  in:[['items','列表[T]','必填']],out:[['result','U','U 由 op 推断']],
  params:[['op','内置算子 | 表达式 | 脚本','—','count/group/ratio/vote/dedupe/sort/top_k/filter/divergence','none',true],['key','字段路径?','—','—','none',true],['levels','列表[{name, when}]','[]','由用户定义分级','none',true],['deterministic','布尔','true','—','kernel',false]],
  locks:['不能调用模型，结果确定，可缓存']},
 {name:'分支',cat:'控制',kind:'atomic',impl:'builtin',
  in:[['value','T','']],out:[['<case>','T','每个 case 一个出口'],['default','T','']],
  params:[['cases','列表[{name, when}]','[]','表达式','none',true],['match','枚举','first','first/all','none',false],['pure','布尔','true','—','kernel',false]],
  locks:['表达式只能读字段：不调模型、无副作用']},
 {name:'循环',cat:'控制',kind:'atomic',impl:'builtin',
  in:[['init','T','']],out:[['final','T',''],['exit','出口名','']],
  params:[['body','子图','—','必填','none',false],['trigger','枚举','rounds','rounds/event','none',false],['exits','列表[{name, when}]','[]','用户自定义出口','none',true],['carry','字段路径列表','[]','只带这些到下一轮','none',false],['stall','{metric, rounds}?','—','无进展检测','none',true],['max_rounds','整数','5','1–50','none',true],['events','列表[事件源]','[]','event 模式','none',false],['checkpoint','枚举','per_round','per_round/per_event/off','none',false]],
  locks:['图中只有循环节点能形成环','至少一个有限出口（轮数 / 预算 / 超时）']},
 {name:'账本',cat:'状态',kind:'atomic',impl:'builtin',
  in:[['value','T','写操作时']],out:[['value','T + version',''],['ack','确认',''],['changed','事件','']],
  params:[['store','账本引用','—','必填','none',false],['scope','枚举','local','local/parent/named','none',false],['op','枚举','read','read/write/append/cas/watch','none',false],['path','字段路径','—','—','none',true]],
  locks:['写入遵守类型字段属性（readonly_except 等）','每次写入留痕']},

function nodeYaml(n){
  let y='node_def: '+n.name+'\nversion: 1.0\nkind: '+n.kind+'\ncategory: '+n.cat+'\nimpl: '+n.impl+(n.entry?'\nentry: '+n.entry:'')+'\nports:\n  inputs:'+(n.in.length?'':' {}')+'\n';
  n.in.forEach(p=>{y+='    '+p[0]+': {type: '+p[1]+(p[2]?', note: '+p[2]:'')+'}\n';});
  y+='  outputs:'+(n.out.length?'':' {}')+'\n';n.out.forEach(p=>{y+='    '+p[0]+': {type: '+p[1]+'}\n';});
  y+='params_schema:\n';n.params.forEach(p=>{y+='  '+p[0]+': {type: '+p[1]+', default: '+p[2]+(p[3]&&p[3]!=='—'?', range: "'+p[3]+'"':'')+', lock: '+p[4]+', promotable: '+p[5]+'}\n';});
  y+='  extra: {type: 开放字典}\ninstance:\n  tags: []\n  hooks: {before: [], after: [], on_error: []}\nauto_ports: {escalation: 升级@1, trace: 日志指针}\n';
  if(n.locks.length){y+='# 内核锁定\n';n.locks.forEach(l=>{y+='#   - '+l+'\n';});}
  return y;

/* ================= 兼容性 ================= */
function parseT(s){const m=/^列表\[(.+)\]$/.exec(s);return m?{list:true,inner:m[1]}:{list:false,inner:s};}
function isSub(a,b){let c=REG[a];while(c&&c.p){if(c.p===b)return true;c=REG[c.p];}return false;}
function check(o,i){
  const A=parseT(o),B=parseT(i),steps=[];let res='yes';
  if(B.inner==='任意'&&!B.list){steps.push(['<b>输入端口为「任意」</b>：可以接收任何类型','ok']);return {res:'yes',steps};}
  if(A.inner==='任意'){steps.push(['<b>输出为「任意」</b>：任意只能进不能出，不能直接接具体类型','er'],['先经过一个设定了 output_schema 的 Agent 节点再连','wn']);return {res:'no',steps};}
  let a=A.inner,b=B.inner;
  if(A.list&&!B.list){steps.push(['<b>列表自动展开</b>：列表['+a+'] 接到单值端口，将对每一项各跑一次（画布显示展开标记）','wn']);res='warn';}
  else if(!A.list&&B.list){steps.push(['<b>单值接列表端口</b>：不会自动包装成列表，请经过汇合节点','er']);return {res:'no',steps};}
  else if(A.list&&B.list) steps.push(['两端都是列表，比较元素类型','ok']);
  if(B.inner==='上下文包@1'&&a!=='上下文包@1'){steps.push(['<b>内核规则</b>：上下文包只能由上下文装配节点产出，Agent 的 context 端口不接受其他类型','er']);return {res:'no',steps};}
  const ra=REG[a],rb=REG[b];
  if(a===b){steps.push(['<b>名义类型相同</b>：'+a,'ok']);return {res,steps};}
  if(ra&&rb&&ra.n===rb.n){
    if(ra.ma!==rb.ma){steps.push(['名义相同，<b>主版本不同</b>（@'+ra.ma+' → @'+rb.ma+'）：不兼容','er'],['类型作者提供迁移函数后可自动转换；否则画布标红连线','wn']);return {res:'no',steps};}
    steps.push(['名义相同，<b>次版本不同</b>（'+ra.ma+'.'+ra.mi+' → '+rb.ma+'.'+rb.mi+'）：次版本只增加可选字段，向后兼容','ok']);return {res,steps};
  }
  if(isSub(a,b)){steps.push(['<b>'+a+' 继承自 '+b+'</b>：子类型只增加字段，不删除必填字段，可以传给父类型端口','ok'],['多出的字段（如 checklist、output_type）在下游不可见','wn']);return {res,steps};}
  if(isSub(b,a)){steps.push(['<b>父类型接子类型端口</b>：'+a+' 缺少 '+b+' 的必填字段','er']);return {res:'no',steps};}
  steps.push(['<b>名义类型不同</b>：'+a+' ≠ '+b+'。即使结构恰好一样也不允许，防止语义不匹配','er'],['需要转换时插一个适配节点（脚本或 Agent）','wn']);return {res:'no',steps};
}

function wizCheck(){
  const w=S.wiz,out=[],known=new Set(REG_KEYS.concat(TYPES.base.map(t=>t.id),allTypes().map(t=>t.id),['工单@1','研究报告@1']));
  if(w.newType) known.add(w.newType);
  out.push(w.name.trim()?['ok','节点名称：'+w.name]:['er','节点名称不能为空']);
  if(findNode(w.name.trim())&&!CUSTOM_NODES.some(n=>n.name===w.name.trim())) out.push(['er','名称与已有节点「'+w.name+'」冲突']);
  const ports=(w.inputs+'\n'+w.outputs).split('\n').map(x=>x.trim()).filter(Boolean);
  ports.forEach(p=>{const t=(p.split(':')[1]||'').trim().replace(/^列表\[(.+)\]$/,'$1');if(!t)out.push(['er','端口「'+p+'」缺少类型']);else if(!known.has(t))out.push(['wn','端口类型「'+t+'」未注册，需在 defines_types 中定义']);});
  if(!w.outputs.trim()) out.push(['er','至少要有一个输出端口']);
  if(w.newType){
    const nm=w.newType.split('@')[0];
    const core=TYPES.sys.concat(TYPES.biz).some(t=>t.id.split('@')[0]===nm)||TYPES.base.some(t=>t.id===nm);
    if(core) out.push(['er','不能修改核心类型：「'+nm+'」已存在。请换名并用 extends 继承它']);
    else if(!w.newTypeExt) out.push(['er','新类型「'+w.newType+'」必须声明 extends（只能继承已有类型或由基础类型组合）']);
    else if(!known.has(w.newTypeExt)) out.push(['er','父类型「'+w.newTypeExt+'」不存在']);
    else out.push(['ok','新类型 '+w.newType+' extends '+w.newTypeExt+'：只加字段，合规']);
  }
  if(w.impl==='script'&&!w.entry) out.push(['er','script 实现需要 entry 文件']);
  if(w.impl==='prompt') out.push(['wn','prompt 实现的节点调用模型：不能作为聚合/分支使用（确定性要求）']);
  if(w.impl==='http') out.push(['wn','http 节点默认风险 L2，运行前过规则审核']);
  out.push(['ok','自动添加 auto_ports：escalation、trace']);
  return out;
}

    if(x.state==='pending') acts='<button class="btn sm ok" data-ap="'+i+'">批准入库</button><button class="btn sm" data-rj="'+i+'">拒绝</button><button class="btn sm" data-vw="'+i+'">查看</button>';
    if(x.state==='tmp') acts='<button class="btn sm ok" data-ap="'+i+'">批准正式入库</button><button class="btn sm" data-rj="'+i+'">丢弃</button><button class="btn sm" data-vw="'+i+'">查看</button>';
    if(x.state==='done') acts='<button class="btn sm" data-vw="'+i+'">查看</button><button class="btn sm" data-ub="'+i+'">回滚</button>';
    return '<div class="draft '+({pending:'',tmp:'tmp',done:'done',rej:'rej'})[x.state]+'"><div class="dh"><b>'+x.id+'</b><span class="bdg '+(x.state==='done'?'d':'k')+'">'+st+'</span></div><div class="kv" style="margin-top:2px">模型起草 · '+x.kind+'</div><div class="why">理由：'+esc(x.why)+'</div><div class="acts">'+acts+'</div></div>';
  }).join('');
}
function modelDraft(kind){
  const l=lvl();
  if(l===0){alog('系统','档位 0 只读：已拒绝模型的起草请求');flashNarr('档位 0 只读，模型不能起草。把档位调到 1 以上再试。');return null;}
  let d;
  if(kind==='type'){
    d={kind:'类型',id:'价格表@1',why:'推演中执行者返回的价格币种和计费周期不统一（美元月付 vs 人民币年付）。新增 价格表@1 继承 执行结果@1，把 currency、period、unit_price 固定成必填字段，并给 currency 标 inherit，保证全局约束透传。',
     obj:{id:'价格表@1',ext:'执行结果@1',pkg:'用户',desc:'统一币种和计费周期后的价格结果。',
      fields:[['task_id','文本',['required','继承']],['status','枚举',['required','继承']],['conclusion','文本',['required','继承']],['sources','列表[{ptr, url, excerpt, time}]',['required_if: status∈{完成,部分}','继承']],['company','文本',['required']],['unit_price','数值',['required']],['currency','枚举',['required','inherit','enum: CNY|USD|EUR']],['period','枚举',['required','enum: 月付|年付']],['tier','文本',[]]],
      vers:[['1.0','模型起草']]}};
  } else {
    d={kind:'节点',id:'汇率换算',why:'价格标准化节点目前只接受同币种输入。起草一个 script 节点，把 价格表@1 按指定日期汇率统一换算，确定性运行，可缓存，不需要调用模型。',
     obj:{name:'汇率换算',cat:'自定义',kind:'atomic',impl:'script',entry:'fx_convert.py',in:[['prices','列表[价格表@1]','']],out:[['converted','列表[价格表@1]','']],
      params:[['target_currency','枚举','CNY','CNY/USD/EUR','none',true],['rate_date','时间','运行当天','—','none',true],['rate_source','枚举','央行中间价','央行中间价/市场价','def',false]],locks:[]}};
  }
  d.state=l===1?'pending':(l===4?'done':'tmp');
  if(kind==='node'&&l===3){d.state='tmp';}
  S.drafts.unshift(d);
  if(d.state!=='pending') install(d,d.state==='tmp');
  alog('模型','起草'+d.kind+' <b>'+d.id+'</b>（'+({pending:'待审批',tmp:'进入临时命名空间',done:'直接入库'})[d.state]+'）');
  rRight();
  return d;
}
function install(d,tmp){
  if(d.kind==='类型'){
    let t=TYPES.user.find(x=>x.id===d.obj.id);
    if(!t){t=JSON.parse(JSON.stringify(d.obj));TYPES.user.push(t);}
    t.tmp=tmp;t.by='模型起草';
    REG['价格表@1']={n:'价格表',ma:1,mi:0,p:'执行结果@1'};
  } else {
    let n=CUSTOM_NODES.find(x=>x.name===d.obj.name);
    if(!n){n=JSON.parse(JSON.stringify(d.obj));CUSTOM_NODES.push(n);}
    n.tmp=tmp;n.by='模型起草';
  }
}
function uninstall(d){
  if(d.kind==='类型'){TYPES.user=TYPES.user.filter(x=>x.id!==d.obj.id);}
  else{const i=CUSTOM_NODES.findIndex(x=>x.name===d.obj.name);if(i>=0)CUSTOM_NODES.splice(i,1);}
}

/* ================= 事件 ================= */
document.querySelector('.bar2').addEventListener('click',e=>{const t=e.target.closest('.tab');if(!t)return;S.tab=t.dataset.tab;render();});
$('lvl').addEventListener('change',()=>{alog('用户','授权档位改为 '+LVN[lvl()]);rRight();});
$('left').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.node){S.node=b.dataset.node;}
  else if(b.dataset.type){S.type=b.dataset.type;}
  else if(b.dataset.pkg){S.pkg=b.dataset.pkg;S.pkgView='detail';}
  else if(b.dataset.wiz){S.pkgView='wiz';}
  else return;
  render();
});
$('mid').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.nv){S.nodeView=b.dataset.nv;render();return;}
  if(b.dataset.pre){const p=PRESETS[+b.dataset.pre];S.cOut=p[0];S.cIn=p[1];render();return;}
  if(b.id==='mdType'){const d=modelDraft('type');if(d&&d.state!=='pending'){S.type=d.obj.id;}render();return;}
  if(b.id==='mdNode'){const d=modelDraft('node');if(d&&d.state!=='pending'){S.tab='nodes';S.node=d.obj.name;}render();return;}
  if(b.id==='pkIn'||b.id==='pkUn'){const p=PKGS.find(x=>x.id===S.pkg);p.installed=b.id==='pkIn';alog('用户',(p.installed?'安装':'卸载')+'扩展包 <b>'+p.name+'</b>');render();return;}
  if(b.dataset.impl){S.wiz.impl=b.dataset.impl;S.wiz.entry={script:'fx.py',prompt:'汇率分析员@1',http:'https://api.example.com/fx',mcp:'fx-mcp','子图':'汇率子图@v0.1'}[b.dataset.impl];render();return;}
  if(b.dataset.ws){S.wiz.step=+b.dataset.ws;render();return;}
  if(b.id==='wReg'){
    const w=S.wiz,ln=s=>s.split('\n').map(x=>x.trim()).filter(Boolean).map(x=>{const a=x.split(':');return [a[0].trim(),(a.slice(1).join(':')||'').trim(),''];});
    const n={name:w.name.trim(),cat:'自定义',kind:w.impl==='子图'?'subgraph':'atomic',impl:w.impl,entry:w.entry,in:ln(w.inputs),out:ln(w.outputs),
      params:ln(w.params).map(p=>[p[0],p[1].split('=')[0].trim(),(p[1].split('=')[1]||'—').trim(),'—','none',true]),locks:[],by:'用户创建'};
    const i=CUSTOM_NODES.findIndex(x=>x.name===n.name);if(i>=0)CUSTOM_NODES.splice(i,1);CUSTOM_NODES.push(n);
    if(w.newType&&w.newTypeExt&&!TYPES.user.some(t=>t.id===w.newType)){TYPES.user.push({id:w.newType,ext:allTypes().some(t=>t.id===w.newTypeExt)?w.newTypeExt:null,pkg:'用户',desc:'由自定义节点向导定义',fields:[['（继承父类型全部字段）','—',['继承']]],vers:[['0.1','向导创建']],by:'用户创建'});const nm=w.newType.split('@')[0];REG[w.newType]={n:nm,ma:1,mi:0,p:REG[w.newTypeExt]?w.newTypeExt:undefined};}
    alog('用户','注册自定义节点 <b>'+n.name+'</b>（'+n.impl+'）');
    S.tab='nodes';S.node=n.name;S.nodeView='form';render();return;
  }
});
$('mid').addEventListener('change',e=>{
  if(e.target.id==='cOut'){S.cOut=e.target.value;render();}
  if(e.target.id==='cIn'){S.cIn=e.target.value;render();}
});
$('mid').addEventListener('input',e=>{const k=e.target.dataset.w;if(k)S.wiz[k]=e.target.value;});
$('right').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const get=k=>S.drafts[+b.dataset[k]];
  if(b.dataset.ap!==undefined){const d=get('ap');install(d,false);d.state='done';alog('用户','批准 <b>'+d.id+'</b> 正式入库');render();return;}
  if(b.dataset.rj!==undefined){const d=get('rj');if(d.state==='tmp')uninstall(d);d.state='rej';alog('用户','拒绝 <b>'+d.id+'</b>');render();return;}
  if(b.dataset.ub!==undefined){const d=get('ub');uninstall(d);d.state='rej';alog('用户','回滚 <b>'+d.id+'</b>，已从库中移除');render();return;}
  if(b.dataset.vw!==undefined){const d=get('vw');
    if(d.kind==='类型'){S.tab='types';if(d.state==='pending'){previewDraftType(d);return;}S.type=d.obj.id;}
    else{S.tab='nodes';if(d.state==='pending'){previewDraftNode(d);return;}S.node=d.obj.name;}
    render();}
});
function previewDraftType(d){
  S.tab='types';render();
  const t=d.obj;
  $('mid').innerHTML='<h2>'+t.id+' <span class="bdg k">草案 · 待审批</span></h2><div class="kv">模型起草 · extends '+t.ext+'</div><p class="sub" style="margin-top:10px">理由：'+esc(d.why)+'</p><div class="sec">字段</div><table><tr><th>字段</th><th>类型</th><th>属性</th></tr>'+t.fields.map(f=>'<tr><td class="m">'+esc(f[0])+'</td><td class="m">'+esc(f[1])+'</td><td>'+f[2].map(a=>'<span class="bdg">'+esc(a)+'</span>').join('')+'</td></tr>').join('')+'</table><div class="sec">内核校验</div><div class="chk"><div><span class="ok">通过</span>继承 执行结果@1，只增加字段</div><div><span class="ok">通过</span>未修改任何核心类型</div><div><span class="ok">通过</span>字段属性均来自内核词表</div></div>';
}
function previewDraftNode(d){
  S.tab='nodes';render();
  const n=d.obj;
  $('mid').innerHTML='<h2>'+n.name+' <span class="bdg k">草案 · 待审批</span></h2><div class="kv">模型起草 · '+n.impl+' · entry: '+n.entry+'</div><p class="sub" style="margin-top:10px">理由：'+esc(d.why)+'</p><div class="sec">node_def</div><pre class="y">'+esc(nodeYaml(n))+'</pre>';
}

/* ================= 演示脚本 ================= */
let demoRun=false;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function flashNarr(t,step){const n=$('narr');n.innerHTML=(step?'<b>'+step+'</b>':'')+t;n.style.display='block';clearTimeout(flashNarr.h);flashNarr.h=setTimeout(()=>{if(!demoRun)n.style.display='none';},3200);}
function pulse(sel){const el=document.querySelector(sel);if(el){el.classList.remove('hl');void el.offsetWidth;el.classList.add('hl');el.scrollIntoView({block:'nearest'});}}
$('demo').addEventListener('click',async()=>{
  if(demoRun)return;demoRun=true;$('demo').disabled=true;
  const steps=[
   ['1/7','查看节点：Agent 节点没有任何业务含义，它是"智囊"还是"执行者"全看接进来的配置。',()=>{S.tab='nodes';S.node='Agent';S.nodeView='form';render();pulse('.locks');}],
   ['2/7','同一份定义的 YAML 视图。画布、表单、YAML 编辑的是同一份数据。',()=>{S.nodeView='yaml';render();}],
   ['3/7','查看类型：任务卡@1 继承 任务@1，字段属性用徽标标出，由运行时强制执行。',()=>{S.nodeView='form';S.tab='types';S.type='任务卡@1';render();pulse('.chain');}],
   ['4/7','兼容性检查：子类型能接父类型端口。',()=>{S.tab='compat';S.cOut='任务卡@1';S.cIn='任务@1';render();pulse('#verdict');}],
   ['5/7','主版本不同就不能连：方案@2 → 方案@1 需要迁移函数。',()=>{S.cOut='方案@2';S.cIn='方案@1';render();pulse('#verdict');}],
   ['6/7','档位 1：让模型起草新类型 价格表@1，进入待审批，右侧可以看到理由。',()=>{$('lvl').value='1';rRight();S.tab='types';render();const d=modelDraft('type');rRight();pulse('.draft');}],
   ['7/7','批准入库：价格表@1 出现在类型库，兼容性检查器也认识它了。',()=>{const i=S.drafts.findIndex(x=>x.state==='pending');if(i>=0){const d=S.drafts[i];install(d,false);d.state='done';alog('用户','批准 <b>'+d.id+'</b> 正式入库');}S.tab='types';S.type='价格表@1';render();pulse('.chain');}]
  ];
  for(const s of steps){s[2]();const n=$('narr');n.innerHTML='<b>'+s[0]+'</b>'+s[1];n.style.display='block';await sleep(3400);}
  S.tab='compat';S.cOut='价格表@1';S.cIn='执行结果@1';render();
  $('narr').innerHTML='<b>完成</b>价格表@1 继承 执行结果@1，可以直接接到原来的端口上。';
  await sleep(3000);
  $('narr').style.display='none';demoRun=false;$('demo').disabled=false;
});

alog('系统','已加载 13 个原子节点、3 个扩展节点、3 个扩展包');
render();

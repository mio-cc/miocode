<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harness · 积木编排模式 demo</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --page-bg:#14161b;--page-panel:#1b1e25;--page-panel2:#222630;--page-line:#2d313b;--page-line2:#3a3f4b;
  --page-text:#e6e4df;--page-muted:#8b8f98;--page-amber:#f0a83c;--page-teal:#5bb8a9;--page-red:#e5646a;
  --page-sans:'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif;
  --page-mono:'JetBrains Mono',Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--page-bg);color:var(--page-text);font-family:var(--page-sans);font-size:14px;overflow:hidden}
button{font-family:inherit;font-size:13px;cursor:pointer}
.app{display:grid;grid-template-columns:210px 1fr;height:100vh}
.app>*{min-width:0}
/* rail */
.rail{border-right:1px solid var(--page-line);padding:16px 12px;display:flex;flex-direction:column;gap:18px;background:#111317}
.brand{font-weight:700;font-size:15px}
.brand span{font-family:var(--page-mono);font-size:11px;color:var(--page-muted);font-weight:400;margin-left:6px}
.rh{font-family:var(--page-mono);font-size:11px;color:var(--page-muted);margin-bottom:6px}
.ri{padding:6px 8px;color:var(--page-muted);border-left:2px solid transparent}
.ri.on{color:var(--page-text);border-left-color:var(--page-amber);background:var(--page-panel)}
/* main */
.main{display:flex;flex-direction:column;height:100vh;position:relative}
.top{height:50px;flex:none;border-bottom:1px solid var(--page-line);display:flex;align-items:center;gap:12px;padding:0 20px}
.top .ttl{font-weight:500}
.pill{font-size:12px;border:1px solid var(--page-line2);padding:2px 9px;color:var(--page-muted)}
.pill.mode{color:var(--page-amber);border-color:var(--page-amber)}
.pill.run{color:var(--page-bg);background:var(--page-amber);border-color:var(--page-amber)}
.pill.ok{color:var(--page-teal);border-color:var(--page-teal)}
.msgs{flex:1;overflow-y:auto;padding:20px 0 12px}
.msg{max-width:1080px;margin:0 auto 14px;padding:0 20px;display:flex;gap:10px}
.msg .av{width:26px;height:26px;flex:none;display:grid;place-items:center;font-size:11px;font-family:var(--page-mono);border:1px solid var(--page-line2);color:var(--page-muted)}
.msg.ai .av{color:var(--page-amber);border-color:var(--page-amber)}
.msg .bd{flex:1;min-width:0;line-height:1.65}
.msg.user .bd{color:var(--page-text);background:var(--page-panel);padding:8px 12px;flex:0 1 auto;margin-left:auto}
.msg.user{flex-direction:row-reverse}
.msg .bd .k{font-family:var(--page-mono);color:var(--page-teal);font-size:12.5px}
.appr{margin-top:8px;display:flex;gap:8px}
.btn{background:var(--page-panel2);color:var(--page-text);border:1px solid var(--page-line2);padding:5px 12px}
.btn:hover{border-color:var(--page-muted)}
.btn.pri{background:var(--page-amber);color:#1a1a1a;border-color:var(--page-amber);font-weight:500}
.btn:disabled{opacity:.4;cursor:default}
.typing{color:var(--page-muted);font-family:var(--page-mono)}
/* composer */
.comp{flex:none;border-top:1px solid var(--page-line);padding:10px 20px 14px}
.compin{max-width:1040px;margin:0 auto}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chip{background:none;border:1px solid var(--page-line2);color:var(--page-muted);padding:3px 10px;font-size:12px}
.chip:hover{color:var(--page-text);border-color:var(--page-muted)}
.inrow{display:flex;gap:8px}
.inrow textarea{flex:1;resize:none;height:44px;background:var(--page-panel);border:1px solid var(--page-line2);color:var(--page-text);font-family:inherit;font-size:14px;padding:10px 12px;outline:none}
.inrow textarea:focus{border-color:var(--page-muted)}
/* card */
.card{border:1px solid var(--page-line2);background:var(--page-panel);height:620px;display:flex;flex-direction:column;margin-top:10px}
.card.max{position:absolute;left:12px;right:12px;top:58px;bottom:138px;height:auto;z-index:20;margin:0;box-shadow:0 0 0 9999px rgba(10,11,14,.55)}
.tb{height:42px;flex:none;border-bottom:1px solid var(--page-line);display:flex;align-items:center;gap:6px;padding:0 10px}
.crumb{display:flex;gap:4px;align-items:center;font-size:13px;min-width:0;overflow:hidden;white-space:nowrap}
.crumb button{background:none;border:none;color:var(--page-muted);padding:2px 4px}
.crumb button.cur{color:var(--page-text);cursor:default}
.crumb i{color:var(--page-line2);font-style:normal}
.sp{flex:1}
.tbtn{background:none;border:1px solid transparent;color:var(--page-muted);padding:4px 9px}
.tbtn:hover{color:var(--page-text);border-color:var(--page-line2)}
.tbtn.run{color:#1a1a1a;background:var(--page-amber);font-weight:500}
.tbtn.stop{color:var(--page-text);background:var(--page-red)}
.body{flex:1;display:flex;min-height:0;position:relative}
.pal{width:138px;flex:none;border-right:1px solid var(--page-line);overflow-y:auto;padding:6px 0}
.pg{font-family:var(--page-mono);font-size:10.5px;color:var(--page-muted);padding:8px 12px 2px}
.pi{display:block;width:100%;text-align:left;background:none;border:none;color:var(--page-text);padding:4px 12px;font-size:13px}
.pi:hover{background:var(--page-panel2);color:var(--page-amber)}
.cv{flex:1;position:relative;overflow:hidden;background:#111317;background-image:radial-gradient(#2a2e37 1px,transparent 1px);background-size:20px 20px;cursor:grab;touch-action:none}
.cv.panning{cursor:grabbing}
.world{position:absolute;left:0;top:0;width:1px;height:1px;transform-origin:0 0}
svg.edges{position:absolute;left:-3000px;top:-3000px;width:9000px;height:9000px;overflow:visible;pointer-events:none}
.edge{fill:none;stroke:#4a4f5c;stroke-width:1.6}
.edge.done{stroke:#3e7d74}
.edge.flow{stroke:var(--page-amber);stroke-width:2;stroke-dasharray:6 6;animation:dash .6s linear infinite}
.edge.sel{stroke:var(--page-text);stroke-width:2.2}
.edge.tmp{stroke:var(--page-amber);stroke-dasharray:4 4}
.ehit{fill:none;stroke:transparent;stroke-width:12;pointer-events:stroke;cursor:pointer}
@keyframes dash{to{stroke-dashoffset:-12}}
.node{position:absolute;width:176px;background:var(--page-panel);border:1px solid var(--page-line2);cursor:default;user-select:none}
.node.sel{outline:2px solid var(--page-text);outline-offset:1px}
.node.flash{animation:flash 1.2s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 6px rgba(240,168,60,.55)}100%{box-shadow:0 0 0 0 rgba(240,168,60,0)}}
.nh{padding:6px 9px 5px;border-bottom:1px solid var(--page-line);cursor:move}
.nt{display:block;font-family:var(--page-mono);font-size:10px;color:var(--page-muted)}
.nl{display:block;font-weight:500;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np{display:flex;justify-content:space-between;padding:4px 0}
.np>div{min-width:0}
.prow{display:flex;align-items:center;gap:5px;font-size:11.5px;height:20px;color:var(--page-muted);white-space:nowrap}
.prow em{font-style:normal;font-family:var(--page-mono);font-size:9.5px;color:#5d6270}
.prow.in{padding-right:4px}.prow.out{justify-content:flex-end;padding-left:4px}
.prow.promo{color:var(--page-amber)}
.dot{width:11px;height:11px;border-radius:50%;flex:none;border:2px solid #111317}
.prow.in .dot{background:var(--page-teal);margin-left:-6px}
.prow.out .dot{background:var(--page-amber);margin-right:-6px;cursor:crosshair}
.prow.out .dot:hover{transform:scale(1.35)}
.ng{font-size:11px;color:var(--page-teal);padding:0 9px 4px;font-family:var(--page-mono)}
.ns{border-top:1px solid var(--page-line);padding:4px 9px 6px;font-size:11px;color:var(--page-muted);font-family:var(--page-mono)}
.bar{height:3px;background:var(--page-line);margin-bottom:4px}
.bar i{display:block;height:100%;width:0;background:var(--page-amber);transition:width .15s}
.node.st-run{border-color:var(--page-amber);box-shadow:0 0 0 3px rgba(240,168,60,.18)}
.node.st-run .ns{color:var(--page-amber)}
.node.st-done{border-color:#3e7d74}
.node.st-done .bar i{background:var(--page-teal)}
.node.st-done .ns{color:var(--page-teal)}
.node.st-wait{border-color:var(--page-amber);border-style:dashed}
.node.st-wait .ns{color:var(--page-amber)}
.node.st-skip{opacity:.45}
.toast{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:var(--page-panel2);border:1px solid var(--page-red);color:var(--page-text);padding:6px 14px;font-size:13px;z-index:5;display:none;max-width:80%}
.toast.ok{border-color:var(--page-teal)}
.hint{position:absolute;left:10px;bottom:8px;font-size:11.5px;color:#666b77;pointer-events:none}
.apbar{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:var(--page-panel2);border:1px dashed var(--page-amber);padding:8px 12px;display:none;gap:10px;align-items:center;z-index:6;font-size:13px}
/* inspector */
.insp{width:270px;flex:none;border-left:1px solid var(--page-line);overflow-y:auto;padding:12px 14px;display:none}
.insp.open{display:block}
.ih{font-family:var(--page-mono);font-size:11px;color:var(--page-muted)}
.insp h4{margin:2px 0 10px;font-size:16px}
.fld{margin-bottom:10px}
.fld label{display:flex;justify-content:space-between;font-family:var(--page-mono);font-size:11.5px;color:var(--page-muted);margin-bottom:3px}
.fld label button{background:none;border:none;color:#666b77;font-size:11px;padding:0}
.fld label button.on{color:var(--page-amber)}
.fld input,.fld select{width:100%;background:#111317;border:1px solid var(--page-line2);color:var(--page-text);padding:5px 7px;font-family:var(--page-mono);font-size:12.5px;outline:none}
.fld input:focus,.fld select:focus{border-color:var(--page-muted)}
.isec{border-top:1px solid var(--page-line);margin-top:12px;padding-top:10px;font-size:12.5px;color:var(--page-muted);line-height:1.6}
.isec b{color:var(--page-text);font-weight:500}
/* run panel */
.rp{flex:none;border-top:1px solid var(--page-line);background:#111317}
.rs{display:flex;gap:18px;align-items:center;padding:6px 12px;font-size:12px;color:var(--page-muted);font-family:var(--page-mono);flex-wrap:wrap}
.rs b{color:var(--page-text);font-weight:600}
.rs .cur{color:var(--page-amber);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:120px}
.rs button{background:none;border:none;color:var(--page-muted);font-family:var(--page-mono);font-size:12px}
.log{height:118px;overflow-y:auto;border-top:1px solid var(--page-line);padding:4px 12px;font-family:var(--page-mono);font-size:11.5px;line-height:1.7}
.log.hide{display:none}
.log .t{color:#5d6270}.log .p{color:var(--page-teal)}.log .w{color:var(--page-amber)}
@media (max-width:820px){.app{grid-template-columns:1fr}.rail{display:none}.pal{width:110px}.insp{position:absolute;right:0;top:0;bottom:0;background:var(--page-panel);z-index:4}}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand">Harness<span>v0.1 demo</span></div>
    <div><div class="rh">运行模式</div>
      <div class="ri">对话</div><div class="ri on">积木编排</div><div class="ri">深度研究</div>
    </div>
    <div><div class="rh">会话</div>
      <div class="ri on">竞品定价调研</div><div class="ri">周报自动生成</div><div class="ri">代码评审流程</div>
    </div>
  </aside>

  <main class="main">
    <div class="top">
      <span class="ttl">竞品定价调研</span>
      <span class="pill mode">模式：积木编排</span>
      <span class="sp"></span>
      <span class="pill" id="gstat">待运行</span>
    </div>

    <div class="msgs" id="msgs">
      <div class="msg user"><div class="av">我</div><div class="bd">帮我把竞品企业版定价调研搭成一个多 agent 流程，要能循环到验收通过为止。</div></div>
      <div class="msg ai"><div class="av">AI</div><div class="bd">
        我按「闭环迭代」模板搭了一张图。外层是主脑，双击「闭环迭代」能进入循环内部。你可以直接改，也可以在下面用文字让我改。
        <div class="card" id="card">
          <div class="tb">
            <div class="crumb" id="crumb"></div>
            <span class="sp"></span>
            <button class="tbtn" id="bFit" title="适应画布">适应</button>
            <button class="tbtn" id="bZo">−</button><button class="tbtn" id="bZi">+</button>
            <button class="tbtn" id="bGroup" title="Ctrl+G">封装选中</button>
            <button class="tbtn" id="bMax">展开</button>
            <button class="tbtn run" id="bRun">运行</button>
          </div>
          <div class="body">
            <div class="pal" id="pal"></div>
            <div class="cv" id="cv">
              <div class="world" id="world"></div>
              <div class="toast" id="toast"></div>
              <div class="apbar" id="apbar"></div>
              <div class="hint">拖动空白处平移 · 滚轮缩放 · 从橙点拖到青点连线 · Shift 多选 · Delete 删除 · 双击子图进入</div>
            </div>
            <div class="insp" id="insp"></div>
          </div>
          <div class="rp">
            <div class="rs">
              <span>用时 <b id="mT">0.0s</b></span>
              <span>tokens <b id="mK">0</b></span>
              <span>节点执行 <b id="mN">0</b> 次</span>
              <span class="cur" id="mC">点「运行」开始</span>
              <button id="bLog">收起日志</button>
            </div>
            <div class="log" id="log"></div>
          </div>
        </div>
      </div></div>
    </div>

    <div class="comp"><div class="compin">
      <div class="chips" id="chips"></div>
      <div class="inrow">
        <textarea id="ta" placeholder="用文字改图，例如：在选中的节点后面加一个人工审批"></textarea>
        <button class="btn pri" id="send">发送</button>
      </div>
    </div></div>
  </main>
</div>

<script>
/* ========== 节点定义（13 个原子节点） ========== */
const DEF={
 '资源':{cat:'资源',in:[],out:[['ref','引用']],params:{kind:['模型',['模型','提示词','列表','常量']],value:'large-model'}},
 'Agent':{cat:'智能体',in:[['context','上下文包'],['model','引用'],['tools','工具端点',1]],out:[['result','T']],params:{output_schema:'方案@1',lifecycle:['ephemeral',['ephemeral','resident']],max_tool_calls:'10'}},
 '上下文装配':{cat:'状态',in:[['in','任意',1],['model','引用']],out:[['context','上下文包']],params:{recipe:'执行者配方@1',budget:'0.1×窗口',on_overflow:['pointer',['pointer','summarize','truncate','reject']]}},
 '账本':{cat:'状态',in:[['value','任意']],out:[['value','任意']],params:{op:['read',['read','write','append','cas','watch']],path:'目标树'}},
 '工具':{cat:'工具',in:[['request','任意']],out:[['endpoint','工具端点'],['result','T']],params:{tool:['检索',['检索','代码执行','HTTP','浏览器','文件写','邮件']],mode:['endpoint',['endpoint','direct']],risk:['L0',['L0','L1','L2','L3']]}},
 '扇出':{cat:'拓扑',in:[['items','任意'],['shared','任意',1]],out:[['results','列表']],params:{n:'3',concurrency:'3',isolation:['true',['true','false']],vary:'model ← items'}},
 '汇合':{cat:'拓扑',in:[['in','任意',1]],out:[['collected','列表']],params:{wait:['all',['all','k_of_n','first','timeout']],timeout:'300s'}},
 '聚合':{cat:'聚合',in:[['items','列表']],out:[['result','T']],params:{op:['group_ratio',['group_ratio','vote','dedupe','sort','top_k','divergence']],key:'cluster'}},
 '分支':{cat:'控制',in:[['value','T']],out:[['yes','T'],['no','T']],params:{when:'判定.achieved == true'}},
 '循环':{cat:'控制',in:[['init','T']],out:[['final','T']],params:{max_rounds:'5',trigger:['rounds',['rounds','event']],stall:'连续 2 轮无进展'},sub:1},
 '人工':{cat:'人工',in:[['request','任意']],out:[['approved','T'],['rejected','T']],params:{mode:['approve',['approve','input','choose']],timeout:'24h'}},
 '子图端口':{cat:'边界',in:[['in','任意']],out:[['out','任意']],params:{role:['entry',['entry','exit','summary','escalation']],max_chars:'300'}},
 '子图引用':{cat:'组合',in:[['in','任意']],out:[['out','任意']],params:{ref:'新子图@v0.1',pin:['snapshot',['snapshot','link']],budget:'父级划拨'},sub:1}
};
const PAL=[['资源',['资源']],['智能体',['Agent']],['状态',['上下文装配','账本']],['工具',['工具']],['拓扑',['扇出','汇合']],['聚合',['聚合']],['控制',['分支','循环']],['人工',['人工']],['边界 · 组合',['子图端口','子图引用']]];

let UID=0; const uid=()=> 'n'+(++UID);
function mk(type,label,x,y,params,children){
  const d=DEF[type],p={};
  for(const k in d.params){const v=d.params[k];p[k]=Array.isArray(v)?v[0]:v;}
  Object.assign(p,params||{});
  const n={id:uid(),type,label:label||type,x,y,params:p,promoted:[],status:'idle',sub:'',prog:0};
  if(d.sub) n.children=children||{nodes:[mk('子图端口','入口',0,60,{role:'entry'}),mk('子图端口','出口',400,60,{role:'exit'})],edges:[]};
  return n;
}
const E=(a,ap,b,bp)=>({id:'e'+(++UID),f:a.id,fp:ap,t:b.id,tp:bp});
function ports(n){const d=DEF[n.type];return {in:d.in.concat(n.promoted.map(k=>[k,'任意',0,1])),out:d.out};}
const compat=(a,b)=>a===b||a==='任意'||b==='任意'||a==='T'||b==='T';

/* ========== 模板：闭环迭代 ========== */
function template(){
  const e=mk('子图端口','入口',20,40,{role:'entry'});
  const r=mk('资源','模型列表[]',20,220,{kind:'列表',value:'3 家厂商的大模型'});
  const a=mk('扇出','智囊团 ×3',240,40,{n:'3',vary:'model ← items'});
  const k1=mk('上下文装配','聚类员配方',460,40,{recipe:'聚类员配方@1'});
  const b=mk('Agent','聚类员',680,40,{output_schema:'簇标注@1'});
  const c=mk('聚合','按比例分级',900,40,{op:'group_ratio',key:'cluster'});
  const k2=mk('上下文装配','决策者配方',1120,40,{recipe:'决策者配方@1'});
  const d=mk('Agent','决策者',1120,250,{output_schema:'任务卡@1[]'});
  const f=mk('扇出','执行池',900,250,{n:'3',concurrency:'3',vary:'—'});
  const t=mk('工具','检索',900,470,{tool:'检索',risk:'L0'});
  const k3=mk('上下文装配','验收者配方',680,250,{recipe:'验收者配方@1'});
  const v=mk('Agent','验收者',460,250,{output_schema:'判定@1'});
  const g=mk('分支','达成？',240,250,{when:'判定.achieved == true'});
  const x=mk('子图端口','出口',20,250,{role:'exit'});
  const inner={nodes:[e,r,a,k1,b,c,k2,d,f,t,k3,v,g,x],edges:[
    E(e,'out',a,'shared'),E(r,'ref',a,'items'),E(a,'results',k1,'in'),E(k1,'context',b,'context'),
    E(b,'result',c,'items'),E(c,'result',k2,'in'),E(k2,'context',d,'context'),E(d,'result',f,'items'),
    E(t,'endpoint',f,'shared'),E(f,'results',k3,'in'),E(k3,'context',v,'context'),E(v,'result',g,'value'),
    E(g,'yes',x,'in')]};
  const l1=mk('账本','目标账本 · 读',20,40,{op:'read',path:'目标树'});
  const big=mk('资源','大模型',20,240,{kind:'模型',value:'large-model'});
  const c0=mk('上下文装配','主脑配方',240,40,{recipe:'主脑配方@1',budget:'0.05×窗口'});
  const m=mk('Agent','主脑',460,40,{lifecycle:'resident',output_schema:'目标@1'});
  const L=mk('循环','闭环迭代',680,40,{max_rounds:'5'},inner);
  const p=mk('子图端口','摘要端口',900,40,{role:'summary',max_chars:'300'});
  const l2=mk('账本','目标账本 · 写',1120,40,{op:'append',path:'进度'});
  return {nodes:[l1,big,c0,m,L,p,l2],edges:[
    E(l1,'value',c0,'in'),E(big,'ref',c0,'model'),E(c0,'context',m,'context'),E(big,'ref',m,'model'),
    E(m,'result',L,'init'),E(L,'final',p,'in'),E(p,'out',l2,'value')]};
}

/* ========== 状态 ========== */
let root=template();
let stack=[{label:'根图',g:root}];
const cur=()=>stack[stack.length-1].g;
let sel=new Set(), selEdge=null;
let zoom=1,pan={x:20,y:20},needFit=true;
const $=id=>document.getElementById(id);
const world=$('world'),cv=$('cv');

/* ========== 渲染 ========== */
function nodeHTML(n){
  const P=ports(n);
  const ins=P.in.map(p=>`<div class="prow in${p[3]?' promo':''}"><span class="dot" data-n="${n.id}" data-p="${p[0]}" data-d="in" title="${p[1]}"></span>${p[0]}<em>${p[1]}</em></div>`).join('');
  const outs=P.out.map(p=>`<div class="prow out"><em>${p[1]}</em>${p[0]}<span class="dot" data-n="${n.id}" data-p="${p[0]}" data-d="out" title="${p[1]}"></span></div>`).join('');
  const grp=n.children?`<div class="ng">子图 · ${n.children.nodes.length} 个节点 · 双击进入</div>`:'';
  return `<div class="node st-${n.status}${sel.has(n.id)?' sel':''}${n.flash?' flash':''}" data-id="${n.id}" style="left:${n.x}px;top:${n.y}px">
    <div class="nh"><span class="nt">${n.type}${n.type==='Agent'&&n.params.lifecycle==='resident'?' · resident':''}</span><span class="nl">${n.label}</span></div>
    <div class="np"><div>${ins}</div><div>${outs}</div></div>${grp}
    <div class="ns"><div class="bar"><i style="width:${n.prog}%"></i></div><span class="stx">${stTxt(n)}</span></div></div>`;
}
function stTxt(n){return n.sub||({idle:'待运行',run:'运行中',done:'完成',wait:'等待中',skip:'未触发'})[n.status];}
function render(){
  const g=cur();
  world.innerHTML='<svg class="edges" id="svg"><g id="eg" transform="translate(3000,3000)"></g></svg>'+g.nodes.map(nodeHTML).join('');
  g.nodes.forEach(n=>n.flash=false);
  applyT();
  requestAnimationFrame(()=>{ if(needFit){fit();needFit=false;} drawEdges(); });
  crumb(); insp();
}
function upd(n){
  const el=world.querySelector(`.node[data-id="${n.id}"]`); if(!el) return;
  el.className=`node st-${n.status}${sel.has(n.id)?' sel':''}`;
  el.querySelector('.stx').textContent=stTxt(n);
  el.querySelector('.bar i').style.width=n.prog+'%';
  const ng=el.querySelector('.ng'); if(ng&&n.children) ng.textContent=`子图 · ${n.children.nodes.length} 个节点 · 双击进入`;
}
function dotPos(nid,port,dir){
  const d=world.querySelector(`.dot[data-n="${nid}"][data-p="${port}"][data-d="${dir}"]`); if(!d) return null;
  const r=d.getBoundingClientRect(),w=world.getBoundingClientRect();
  return [(r.left+r.width/2-w.left)/zoom,(r.top+r.height/2-w.top)/zoom];
}
const curve=(a,b)=>{const dx=Math.max(40,Math.abs(b[0]-a[0])/2);return `M${a[0]},${a[1]} C${a[0]+dx},${a[1]} ${b[0]-dx},${b[1]} ${b[0]},${b[1]}`;};
function edgeActive(e,g){const s=g.nodes.find(x=>x.id===e.f);return s&&s.status==='done'&&(!s.activeOut||s.activeOut===e.fp);}
function drawEdges(){
  const eg=$('eg'); if(!eg) return; const g=cur(); let h='';
  g.edges.forEach(e=>{
    const a=dotPos(e.f,e.fp,'out'),b=dotPos(e.t,e.tp,'in'); if(!a||!b) return;
    const cls=e.id===selEdge?'sel':(e.flow?'flow':(edgeActive(e,g)?'done':''));
    const ty=(ports(g.nodes.find(x=>x.id===e.f)).out.find(p=>p[0]===e.fp)||[,''])[1];
    const d=curve(a,b);
    h+=`<path class="edge ${cls}" d="${d}"><title>${ty}</title></path><path class="ehit" data-e="${e.id}" d="${d}"><title>${e.fp} → ${e.tp}（${ty}）</title></path>`;
  });
  eg.innerHTML=h+'<path class="edge tmp" id="tmp" d=""/>';
}
function applyT(){world.style.transform=`translate(${pan.x}px,${pan.y}px) scale(${zoom})`;}
function fit(){
  const els=[...world.querySelectorAll('.node')]; if(!els.length) return;
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  cur().nodes.forEach(n=>{const el=world.querySelector(`.node[data-id="${n.id}"]`);x0=Math.min(x0,n.x);y0=Math.min(y0,n.y);x1=Math.max(x1,n.x+el.offsetWidth);y1=Math.max(y1,n.y+el.offsetHeight);});
  const W=cv.clientWidth,H=cv.clientHeight;
  zoom=Math.max(.35,Math.min(1,(W-60)/(x1-x0),(H-60)/(y1-y0)));
  pan.x=(W-(x1-x0)*zoom)/2-x0*zoom; pan.y=(H-(y1-y0)*zoom)/2-y0*zoom; applyT(); drawEdges();
}
function crumb(){
  $('crumb').innerHTML=stack.map((s,i)=>`${i?'<i>/</i>':''}<button data-i="${i}" class="${i===stack.length-1?'cur':''}">${s.label}</button>`).join('');
}
$('crumb').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const i=+b.dataset.i;if(i<stack.length-1){stack=stack.slice(0,i+1);sel.clear();selEdge=null;needFit=true;render();}});

/* ========== 调色板 ========== */
$('pal').innerHTML=PAL.map(g=>`<div class="pg">${g[0]}</div>`+g[1].map(t=>`<button class="pi" draggable="true" data-t="${t}">${t}</button>`).join('')).join('');
$('pal').addEventListener('click',e=>{const b=e.target.closest('.pi');if(!b)return;const c=toWorld(cv.clientWidth/2,cv.clientHeight/2);addNode(b.dataset.t,c[0]-88+Math.random()*40,c[1]-50+Math.random()*40);});
$('pal').addEventListener('dragstart',e=>{const b=e.target.closest('.pi');if(b)e.dataTransfer.setData('text/plain',b.dataset.t);});
cv.addEventListener('dragover',e=>e.preventDefault());
cv.addEventListener('drop',e=>{e.preventDefault();const t=e.dataTransfer.getData('text/plain');if(!DEF[t])return;const r=cv.getBoundingClientRect();const c=toWorld(e.clientX-r.left,e.clientY-r.top);addNode(t,c[0]-88,c[1]-20);});
const toWorld=(sx,sy)=>[(sx-pan.x)/zoom,(sy-pan.y)/zoom];
function addNode(t,x,y){const n=mk(t,null,Math.round(x),Math.round(y));n.flash=true;cur().nodes.push(n);sel=new Set([n.id]);selEdge=null;render();return n;}

/* ========== 画布交互 ========== */
let drag=null;
cv.addEventListener('pointerdown',e=>{
  if(e.button!==0) return;
  const dot=e.target.closest('.dot');
  if(dot&&dot.dataset.d==='out'){drag={k:'link',n:dot.dataset.n,p:dot.dataset.p};e.preventDefault();return;}
  if(e.target.closest('.ehit')){selEdge=e.target.closest('.ehit').dataset.e;sel.clear();render();return;}
  const ne=e.target.closest('.node');
  if(ne){
    const id=ne.dataset.id;
    if(e.shiftKey||e.ctrlKey||e.metaKey){sel.has(id)?sel.delete(id):sel.add(id);}
    else if(!sel.has(id)){sel=new Set([id]);}
    selEdge=null;
    world.querySelectorAll('.node').forEach(el=>el.classList.toggle('sel',sel.has(el.dataset.id)));
    insp();drawEdges();
    if(e.target.closest('.nh')) drag={k:'move',x:e.clientX,y:e.clientY};
    return;
  }
  drag={k:'pan',x:e.clientX,y:e.clientY,moved:0};cv.classList.add('panning');
});
window.addEventListener('pointermove',e=>{
  if(!drag) return;
  if(drag.k==='pan'){pan.x+=e.clientX-drag.x;pan.y+=e.clientY-drag.y;drag.moved+=Math.abs(e.clientX-drag.x)+Math.abs(e.clientY-drag.y);drag.x=e.clientX;drag.y=e.clientY;applyT();}
  else if(drag.k==='move'){
    const dx=(e.clientX-drag.x)/zoom,dy=(e.clientY-drag.y)/zoom;drag.x=e.clientX;drag.y=e.clientY;
    cur().nodes.forEach(n=>{if(sel.has(n.id)){n.x+=dx;n.y+=dy;const el=world.querySelector(`.node[data-id="${n.id}"]`);el.style.left=n.x+'px';el.style.top=n.y+'px';}});
    drawEdges();
  } else if(drag.k==='link'){
    const a=dotPos(drag.n,drag.p,'out'),r=cv.getBoundingClientRect(),b=toWorld(e.clientX-r.left,e.clientY-r.top);
    const t=$('tmp'); if(t&&a) t.setAttribute('d',curve(a,b));
  }
});
window.addEventListener('pointerup',e=>{
  if(!drag) return;
  if(drag.k==='link'){
    const el=document.elementFromPoint(e.clientX,e.clientY),dot=el&&el.closest('.dot');
    if(dot&&dot.dataset.d==='in') connect(drag.n,drag.p,dot.dataset.n,dot.dataset.p);
    else {const t=$('tmp');if(t)t.setAttribute('d','');}
  }
  if(drag.k==='pan'){cv.classList.remove('panning');if(drag.moved<4&&(sel.size||selEdge)){sel.clear();selEdge=null;render();}}
  drag=null;
});
cv.addEventListener('wheel',e=>{e.preventDefault();const r=cv.getBoundingClientRect(),sx=e.clientX-r.left,sy=e.clientY-r.top,w=toWorld(sx,sy);
  zoom=Math.max(.3,Math.min(1.8,zoom*(e.deltaY<0?1.1:.9)));pan.x=sx-w[0]*zoom;pan.y=sy-w[1]*zoom;applyT();},{passive:false});
cv.addEventListener('dblclick',e=>{const ne=e.target.closest('.node');if(!ne)return;const n=cur().nodes.find(x=>x.id===ne.dataset.id);if(n&&n.children)enter(n);});
function enter(n){stack.push({label:n.label,g:n.children,node:n});sel.clear();selEdge=null;needFit=true;render();}

function reach(g,from,to){const st=[from],seen=new Set();while(st.length){const x=st.pop();if(x===to)return true;if(seen.has(x))continue;seen.add(x);g.edges.forEach(e=>{if(e.f===x)st.push(e.t);});}return false;}
function connect(fn,fp,tn,tp,quiet){
  const g=cur(),A=g.nodes.find(x=>x.id===fn),B=g.nodes.find(x=>x.id===tn);
  if(fn===tn){toast('不能连到自己');drawEdges();return false;}
  const to=ports(A).out.find(p=>p[0]===fp)[1],ti=ports(B).in.find(p=>p[0]===tp);
  if(!compat(to,ti[1])){toast(`类型不匹配：${to} 不能接到 ${ti[1]}`);drawEdges();return false;}
  if(reach(g,tn,fn)){toast('内核规则：环只能通过「循环」节点形成，把要迭代的部分封装进循环');drawEdges();return false;}
  if(g.edges.some(e=>e.f===fn&&e.fp===fp&&e.t===tn&&e.tp===tp)){drawEdges();return false;}
  if(!ti[2]) g.edges=g.edges.filter(e=>!(e.t===tn&&e.tp===tp));
  g.edges.push(E(A,fp,B,tp)); drawEdges();
  if(!quiet) toast(`已连接 ${A.label}.${fp} → ${B.label}.${tp}`,1);
  return true;
}
function toast(t,ok){const el=$('toast');el.textContent=t;el.className='toast'+(ok?' ok':'');el.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>el.style.display='none',2200);}
function delSel(){
  const g=cur();
  if(selEdge){g.edges=g.edges.filter(e=>e.id!==selEdge);selEdge=null;render();return;}
  if(!sel.size) return;
  g.nodes=g.nodes.filter(n=>!sel.has(n.id));g.edges=g.edges.filter(e=>!sel.has(e.f)&&!sel.has(e.t));sel.clear();render();
}
document.addEventListener('keydown',e=>{
  if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();delSel();}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='g'){e.preventDefault();groupSel(true);}
});

/* ========== 封装为子图 ========== */
function groupSel(say){
  const g=cur();const ids=[...sel].filter(id=>g.nodes.some(n=>n.id===id));
  if(ids.length<2){toast('先按住 Shift 选中至少 2 个节点');if(say)ai('要封装的话，先按住 Shift 点选至少 2 个节点，再点「封装选中」。');return;}
  const S=new Set(ids),inside=g.nodes.filter(n=>S.has(n.id));
  const innerE=g.edges.filter(e=>S.has(e.f)&&S.has(e.t)),inc=g.edges.filter(e=>!S.has(e.f)&&S.has(e.t)),out=g.edges.filter(e=>S.has(e.f)&&!S.has(e.t));
  const x0=Math.min(...inside.map(n=>n.x)),y0=Math.min(...inside.map(n=>n.y)),x1=Math.max(...inside.map(n=>n.x));
  const en=mk('子图端口','入口',x0-230,y0,{role:'entry'}),ex=mk('子图端口','出口',x1+230,y0,{role:'exit'});
  const ch={nodes:[en,...inside,ex],edges:[...innerE]};
  inc.forEach(e=>ch.edges.push(E(en,'out',inside.find(n=>n.id===e.t),e.tp)));
  out.forEach(e=>ch.edges.push(E(inside.find(n=>n.id===e.f),e.fp,ex,'in')));
  const G=mk('子图引用','新子图',Math.round(x0),Math.round(y0),{ref:'新子图@v0.1'},ch);G.flash=true;
  g.nodes=g.nodes.filter(n=>!S.has(n.id)).concat(G);
  g.edges=g.edges.filter(e=>!S.has(e.f)&&!S.has(e.t));
  const seenIn=new Set();inc.forEach(e=>{const k=e.f+e.fp;if(!seenIn.has(k)){seenIn.add(k);g.edges.push({id:'e'+(++UID),f:e.f,fp:e.fp,t:G.id,tp:'in'});}});
  out.forEach(e=>g.edges.push({id:'e'+(++UID),f:G.id,fp:'out',t:e.t,tp:e.tp}));
  sel=new Set([G.id]);render();
  ai(`已把 ${ids.length} 个节点封装成子图「新子图」，自动补了入口和出口端口，外部的连线也改接到了子图上。右侧可以改名、设版本和预算，双击它能进入内部。`);
}

/* ========== 检查器 ========== */
function insp(){
  const el=$('insp'),g=cur();
  if(selEdge){const e=g.edges.find(x=>x.id===selEdge);if(!e){el.classList.remove('open');return;}
    const A=g.nodes.find(n=>n.id===e.f),B=g.nodes.find(n=>n.id===e.t);
    el.innerHTML=`<div class="ih">连线</div><h4>${A.label} → ${B.label}</h4><div class="isec"><b>${e.fp}</b> → <b>${e.tp}</b><br>类型：${ports(A).out.find(p=>p[0]===e.fp)[1]}</div><div class="isec"><button class="btn" id="iDel">删除连线</button></div>`;
    el.classList.add('open');$('iDel').onclick=delSel;return;}
  if(sel.size!==1){
    if(sel.size>1){el.innerHTML=`<div class="ih">多选</div><h4>已选 ${sel.size} 个节点</h4><div class="isec">可以一起拖动，或封装成一个子图，作为新的积木复用。</div><div class="isec"><button class="btn pri" id="iGrp">封装为子图</button> <button class="btn" id="iDel">删除</button></div>`;
      el.classList.add('open');$('iGrp').onclick=()=>groupSel(false);$('iDel').onclick=delSel;}
    else el.classList.remove('open');
    return;}
  const n=g.nodes.find(x=>x.id===[...sel][0]); if(!n){el.classList.remove('open');return;}
  const d=DEF[n.type];
  let h=`<div class="ih">${d.cat} · ${n.type}</div><h4>${n.label}</h4>`;
  h+=`<div class="fld"><label>名称</label><input data-k="__label" value="${n.label}"></div>`;
  for(const k in d.params){
    const v=d.params[k],pr=n.promoted.includes(k);
    h+=`<div class="fld"><label>${k}<button data-pro="${k}" class="${pr?'on':''}" title="把参数转成输入端口，值由上游提供">${pr?'已转端口':'转端口'}</button></label>`;
    h+=Array.isArray(v)?`<select data-k="${k}" ${pr?'disabled':''}>${v[1].map(o=>`<option ${o===n.params[k]?'selected':''}>${o}</option>`).join('')}</select>`
      :`<input data-k="${k}" value="${n.params[k]}" ${pr?'disabled':''}>`;
    h+='</div>';
  }
  h+=`<div class="isec">状态：<b>${stTxt(n)}</b>${n.out?`<br>最近输出：${n.out}`:''}</div>`;
  if(n.children) h+=`<div class="isec"><button class="btn" id="iEnter">进入子图（${n.children.nodes.length} 个节点）</button></div>`;
  h+=`<div class="isec"><button class="btn" id="iDel">删除节点</button></div>`;
  el.innerHTML=h;el.classList.add('open');
  if($('iEnter'))$('iEnter').onclick=()=>enter(n);
  $('iDel').onclick=delSel;
}
$('insp').addEventListener('input',e=>{
  const k=e.target.dataset.k;if(!k)return;const n=cur().nodes.find(x=>x.id===[...sel][0]);if(!n)return;
  if(k==='__label'){n.label=e.target.value;const el=world.querySelector(`.node[data-id="${n.id}"] .nl`);if(el)el.textContent=n.label;}
  else n.params[k]=e.target.value;
});
$('insp').addEventListener('click',e=>{
  const k=e.target.dataset.pro;if(!k)return;const n=cur().nodes.find(x=>x.id===[...sel][0]);
  n.promoted.includes(k)?n.promoted.splice(n.promoted.indexOf(k),1):n.promoted.push(k);
  if(!n.promoted.includes(k)) cur().edges=cur().edges.filter(x=>!(x.t===n.id&&x.tp===k));

/* ========== 运行（模拟） ========== */
let R={running:false};
const sleep=ms=>new Promise((res,rej)=>setTimeout(()=>R.stop?rej('stop'):res(),ms));
function log(p,m,w){const el=$('log');const t=((Date.now()-R.t0)/1000).toFixed(1).padStart(5,' ');
  el.insertAdjacentHTML('beforeend',`<div><span class="t">${t}s</span> <span class="p">${p}</span> <span class="${w?'w':''}">${m}</span></div>`);el.scrollTop=el.scrollHeight;}
function resetAll(g){g.nodes.forEach(n=>{n.status='idle';n.sub='';n.prog=0;n.activeOut=null;n.out='';upd(n);if(n.children)resetAll(n.children);});}
function flowOut(n,g){g.edges.forEach(e=>{if(e.f===n.id&&(!n.activeOut||n.activeOut===e.fp)){e.flow=true;setTimeout(()=>{e.flow=false;if(cur()===g)drawEdges();},900);}});if(cur()===g)drawEdges();}
async function runGraph(g,path,ctx){
  g.nodes.forEach(n=>{n.status='idle';n.sub='';n.prog=0;n.activeOut=null;upd(n);});
  if(cur()===g)drawEdges();
  const done=new Set();
  let level=g.nodes.filter(n=>!g.edges.some(e=>e.t===n.id));
  while(level.length){
    await Promise.all(level.map(n=>runNode(n,g,path,ctx)));
    level.forEach(n=>done.add(n.id));
    level=g.nodes.filter(n=>!done.has(n.id)&&g.edges.filter(e=>e.t===n.id).every(e=>done.has(e.f)));
  }
}
async function runNode(n,g,path,ctx){
  const inc=g.edges.filter(e=>e.t===n.id);
  if(inc.length&&inc.every(e=>!edgeActive(e,g))){n.status='skip';upd(n);return;}
  const p=path+'/'+n.label;
  n.status='run';upd(n);ctx.report&&ctx.report(n.label);$('mC').textContent=p;
  const tk=k=>{R.tokens+=k;};
  switch(n.type){
    case 'Agent':{for(let i=1;i<=6;i++){await sleep(130);tk(150+Math.round(Math.random()*120));n.prog=i/6*100;n.sub='生成中 '+(i*16)+'%';upd(n);}
      n.out=n.params.output_schema;log(p,'输出 '+n.params.output_schema);break;}
    case '扇出':{const N=+n.params.n||3,C=Math.max(1,+n.params.concurrency||3);
      for(let i=1;i<=N;i++){await sleep(C>=N?260:420);tk(700);n.prog=i/N*100;n.sub=`${i}/${N} 完成`;upd(n);ctx.report&&ctx.report(`${n.label} ${i}/${N}`);}
      log(p,`${N} 份并行完成（并发 ${C}）`);break;}
    case '分支':{await sleep(250);const ok=(ctx.round||2)>=2;ctx.achieved=ok;n.activeOut=ok?'yes':'no';n.sub=ok?'是 → yes':'否 → no';
      log(p,ok?'判定达成':'判定未达成：缺 B 公司数据',!ok);break;}
    case '人工':{n.status='wait';n.sub='等待审批';upd(n);const r=await ask(n,p);n.activeOut=r;n.sub=r==='approved'?'已批准':'已驳回';log(p,n.sub,r!=='approved');break;}
    case '循环':case '子图引用':{
      const max=n.type==='循环'?Math.max(1,+n.params.max_rounds||5):1;let r=1,ok=false;
      for(;r<=max;r++){
        const pre=n.type==='循环'?`第 ${r}/${max} 轮 · `:'';
        const c2={round:r,report:t=>{n.sub=pre+t;n.prog=n.type==='循环'?r/max*100:50;upd(n);ctx.report&&ctx.report(n.label+' › '+t);}};
        if(n.type==='循环')log(p,`第 ${r} 轮开始`);
        await runGraph(n.children,p+(n.type==='循环'?'#r'+r:''),c2);
        ok=c2.achieved!==false&&(c2.achieved||n.type!=='循环'||!n.children.nodes.some(x=>x.type==='分支'));
        if(n.type!=='循环'||ok)break;
        if(r<max){ai(`「${n.label}」第 ${r} 轮未达成，验收者生成了差距报告（缺 B 公司数据，官网已查过）。带着差距报告进入第 ${r+1} 轮。`);}
      }
      n.sub=n.type==='循环'?(ok?`第 ${r} 轮达成`:'达到最大轮数'):'完成';
      if(n.type==='循环'&&ok)ai(`「${n.label}」在第 ${r} 轮通过验收，结果已交给下游。`);
      break;}
    default:{await sleep(280);tk(40);}
  }
  n.status='done';n.prog=100;if(n.type!=='循环'&&n.type!=='子图引用'&&n.type!=='分支'&&n.type!=='人工')n.sub='';
  upd(n);R.n++;flowOut(n,g);
  if(sel.has(n.id))insp();
}
let pend=null;
function ask(n,p){
  return new Promise(res=>{
    const id='ap'+n.id+Date.now();
    pend={res,id};
    ai(`「${n.label}」需要你审批才能继续。<div class="appr" id="${id}"><button class="btn pri" data-r="approved">批准</button><button class="btn" data-r="rejected">驳回</button></div>`);
    const bar=$('apbar');bar.innerHTML=`<span>「${n.label}」等待审批</span><button class="btn pri" data-r="approved">批准</button><button class="btn" data-r="rejected">驳回</button>`;bar.style.display='flex';
  });
}
function answer(r){if(!pend)return;const p=pend;pend=null;$('apbar').style.display='none';const el=$(p.id);if(el)el.querySelectorAll('button').forEach(b=>b.disabled=true);p.res(r);}
document.addEventListener('click',e=>{const b=e.target.closest('[data-r]');if(b&&!b.disabled)answer(b.dataset.r);});

async function run(){
  if(R.running){R.stop=true;answer('rejected');return;}
  R={running:true,stop:false,t0:Date.now(),tokens:0,n:0};
  $('log').innerHTML='';resetAll(root);
  $('bRun').textContent='停止';$('bRun').className='tbtn stop';
  const gs=$('gstat');gs.textContent='运行中';gs.className='pill run';
  const tm=setInterval(()=>{$('mT').textContent=((Date.now()-R.t0)/1000).toFixed(1)+'s';$('mK').textContent=(R.tokens/1000).toFixed(1)+'k';$('mN').textContent=R.n;},100);
  ai('开始运行。每个节点的状态会实时显示在画布上，下面的日志按层级路径记录每一步。');
  let ok=true;
  try{await runGraph(root,'根图',{});}catch(e){ok=false;}
  clearInterval(tm);$('mT').textContent=((Date.now()-R.t0)/1000).toFixed(1)+'s';$('mK').textContent=(R.tokens/1000).toFixed(1)+'k';$('mN').textContent=R.n;
  R.running=false;$('bRun').textContent='运行';$('bRun').className='tbtn run';$('apbar').style.display='none';
  gs.textContent=ok?'已完成':'已停止';gs.className='pill'+(ok?' ok':'');
  $('mC').textContent=ok?'运行完成':'已停止';
  ai(ok?`运行完成：用时 ${$('mT').textContent}，约 ${$('mK').textContent} tokens，节点共执行 ${R.n} 次。`:'已停止运行，已完成的节点结果都保留着。');
}

/* ========== 对话（模拟模型改图） ========== */
function addMsg(role,html){
  const m=document.createElement('div');m.className='msg '+role;
  m.innerHTML=`<div class="av">${role==='ai'?'AI':'我'}</div><div class="bd">${html}</div>`;
  $('msgs').appendChild(m);$('msgs').scrollTop=$('msgs').scrollHeight;return m;
}
const ai=h=>addMsg('ai',h);
const KW=[[/人工|审批/,'人工'],[/智囊|agent|模型节点/i,'Agent'],[/工具|检索|搜索/,'工具'],[/扇出|并行/,'扇出'],[/汇合/,'汇合'],[/聚合|投票|去重/,'聚合'],[/分支|判断|条件/,'分支'],[/循环|迭代/,'循环'],[/账本|记忆/,'账本'],[/上下文|装配/,'上下文装配'],[/资源|模型/,'资源'],[/子图/,'子图引用']];
function handle(t){
  if(/停止/.test(t)){if(R.running)run();else ai('当前没有在运行。');return;}
  if(/运行|跑一下|执行|开始/.test(t)){if(R.running)ai('已经在运行了。');else run();return;}
  if(/封装|打包|组合成/.test(t)){groupSel(true);return;}
  if(/模板|重置|闭环/.test(t)&&!/加/.test(t)){root=template();stack=[{label:'根图',g:root}];sel.clear();needFit=true;render();ai('已重新载入「闭环迭代」模板。');return;}
  if(/清空/.test(t)){cur().nodes=[];cur().edges=[];sel.clear();render();ai(`已清空「${stack[stack.length-1].label}」这一层。从左边拖节点进来，或者告诉我要加什么。`);return;}
  for(const [re,ty] of KW) if(re.test(t)){modelAdd(ty);return;}
  ai('这个 demo 里我能听懂这几类指令：<span class="k">加一个 XX 节点</span>（会接在选中节点后面）、<span class="k">运行 / 停止</span>、<span class="k">封装选中节点</span>、<span class="k">清空</span>、<span class="k">重新载入模板</span>。');
}
function modelAdd(ty){
  const g=cur(),s=g.nodes.find(n=>sel.has(n.id))||null;
  let x=s?s.x+230:200,y=s?s.y+30:120;
  while(g.nodes.some(o=>Math.abs(o.x-x)<185&&Math.abs(o.y-y)<120))y+=135;
  const n=mk(ty,null,x,y);n.flash=true;g.nodes.push(n);sel=new Set([n.id]);selEdge=null;render();
  let msg=`已在${s?`「${s.label}」后面`:'画布上'}添加「${ty}」节点`;
  if(s){requestAnimationFrame(()=>{
    let done=false;
    for(const o of ports(s).out){for(const i of ports(n).in){if(compat(o[1],i[1])){done=connect(s.id,o[0],n.id,i[0],true);if(done){msg+=`，并连好了 <span class="k">${s.label}.${o[0]} → ${i[0]}</span>`;break;}}}if(done)break;}
    ai(msg+'。参数在右侧面板里改。');});}
  else ai(msg+'。选中一个节点再让我加，我会自动接上线。');
}
function send(){const ta=$('ta'),t=ta.value.trim();if(!t)return;ta.value='';addMsg('user',t.replace(/</g,'&lt;'));
  const ty=addMsg('ai','<span class="typing">…</span>');setTimeout(()=>{ty.remove();handle(t);},250);}
$('send').onclick=send;
$('ta').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});
const CH=['运行','在选中节点后加一个人工审批','加一个 Agent','封装选中的节点','清空这一层','重新载入模板'];
$('chips').innerHTML=CH.map(c=>`<button class="chip">${c}</button>`).join('');
$('chips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;$('ta').value=b.textContent;send();});

/* ========== 工具栏 ========== */
$('bRun').onclick=run;
$('bFit').onclick=fit;
$('bZi').onclick=()=>{zoom=Math.min(1.8,zoom*1.15);applyT();};
$('bZo').onclick=()=>{zoom=Math.max(.3,zoom/1.15);applyT();};
$('bGroup').onclick=()=>groupSel(true);
$('bMax').onclick=()=>{const c=$('card');c.classList.toggle('max');$('bMax').textContent=c.classList.contains('max')?'收起':'展开';requestAnimationFrame(fit);};
$('bLog').onclick=()=>{const l=$('log');l.classList.toggle('hide');$('bLog').textContent=l.classList.contains('hide')?'展开日志':'收起日志';requestAnimationFrame(drawEdges);};
window.addEventListener('resize',()=>drawEdges());

render();
</script>

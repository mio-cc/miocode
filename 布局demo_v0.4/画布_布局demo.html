<!--
==============================================================================
  Harness · 积木编排 · 画布旗舰 demo  v0.3
  规范：同目录 DESIGN.md（交互/视觉规则）与 tokens.css（全部令牌）。
  本文件由 src/ 下的源码按文件名顺序拼接生成（src/build.py）。改代码请改 src/，再重新拼装。

  代码地图（src/ 文件 → 职责）
  ──────────────────────────────────────────────────────────────────────────
  00_head.html      文档头、字体、<style> 开始
  01_tokens.css     tokens.css 原样内联（唯一的颜色/字号/间距/动效来源）
  02_base.css       重置、应用骨架（侧栏/对话/卡片/输入框/舞台/顶部条）
  03_node.css       画布、世界容器、节点（头部/端口/内联控件/状态脚）、8 种状态、LOD
  04_edge.css       连线、流动光点、幽灵/删除态、连线浮动按钮、框选、AI 光标
  05_panels.css     顶部条部件、节点库、检查器、小地图、停靠栏、提议栏、运行抽屉
  06_controls.css   按钮、步进、滑块、下拉、分段、开关、输入、徽标、提示、菜单、命令面板、通知
  10_body.html      </style>、静态 DOM 骨架
  20_icons.js       HX.ICON（13 种节点图标）、HX.UI（界面图标）、HX.STI（状态图标）
  21_defs.js        HX.DEF 节点定义、端口类型色、类型兼容、示例图模板
  22_state.js       HX.S 全局状态、图操作 Op 工厂、dispatch / undo / redo（唯一修改入口）
  23_geom.js        端口坐标（布局常数计算，不读 DOM）、贝塞尔、环检测、拓扑、自动布局
  24_render.js      renderView / renderNode / renderEdges / sync / 小地图 / 视口裁剪
  25_pointer.js     指针：平移、拖动、连线（吸附/兼容高亮）、框选、滚轮缩放、内联控件
  26_keys.js        快捷键、右键菜单、命令面板、快速添加、封装/解散/复制/删除
  27_panels.js      节点库、检查器、运行抽屉（时间线/日志/操作历史）、通知、提示、档位
  28_run.js         运行模拟（拓扑执行、循环轮次、人工审批挂起、急停）
  29_model.js       模型操作者：对话指令、提议（幽灵节点）/直接修改、AI 光标
  30_embed.js       卡片/展开/全屏 FLIP、主题、压力测试 + FPS、初始化
  99_tail.html      结束标记

  约定：所有模块挂在 window.HX 上，每个文件是一个 IIFE。
        修改图只能通过 HX.dispatch(op)；op = {kind,label,actor,reason,apply(),revert()}。
==============================================================================
-->

/* ==========================================================================
   Harness · 积木编排 设计令牌 tokens.css  v0.3.2
   唯一事实来源。所有页面、组件只能引用这里的变量，不得写裸色值。
   命名：--hx-<类别>-<名称>。
   主题：默认浅色（:root）。深色通过 <html data-theme="dark"> 启用。
   细则见 docs/02_色彩系统与主题.md
   ========================================================================== */

/* ---------------- 浅色（默认） ---------------- */
:root,
[data-theme="light"] {
  color-scheme: light;

  /* 表面：从底到顶。浅色下越往上越"白"，层级主要靠外框和阴影区分 */
  --hx-bg-0: #f3f3f1;          /* 应用最底层：侧栏、对话背景 */
  --hx-bg-1: #f8f8f6;          /* 画布底色 */
  --hx-bg-2: #ffffff;          /* 浮动面板、检查器、停靠栏 */
  --hx-bg-3: #ffffff;          /* 节点主体、卡片 */
  --hx-bg-4: #f2f2ef;          /* 输入框、悬停态 */
  --hx-bg-5: #e8e8e4;          /* 按下态、分段控件选中项 */

  /* 线 */
  --hx-line-1: rgba(24,24,32,.06);   /* 内部分区 */
  --hx-line-2: rgba(24,24,32,.11);   /* 节点、面板外框 */
  --hx-line-3: rgba(24,24,32,.20);   /* 悬停外框 */
  --hx-highlight: rgba(255,255,255,.9);

  /* 文字（对白色背景：均按 WCAG 实测：text-3、accent-strong、ok、wait 作小号文字 ≥ 4.5:1，见 docs/16） */
  --hx-text-1: #16171b;
  --hx-text-2: #4f535c;
  --hx-text-3: #6b6f78;
  --hx-text-inv: #1c1404;      /* 强调色背景上的文字：两种主题都用深色字压在琥珀色上 */

  /* 语义色 */
  --hx-accent: #f0a01e;        /* 运行中 / 主路径 / 主按钮底色 */
  --hx-accent-strong: #9a5c00; /* 浅色下用作文字、细线的琥珀色（对白 ≥ 4.5:1） */
  --hx-accent-weak: rgba(240,160,30,.14);
  --hx-accent-line: rgba(200,125,0,.55);
  --hx-ok: #1d8250;
  --hx-ok-weak: rgba(35,144,90,.11);
  --hx-danger: #d0414a;
  --hx-danger-weak: rgba(208,65,74,.10);
  --hx-wait: #94700a;
  --hx-wait-weak: rgba(200,150,20,.14);
  --hx-model: #4f5fd6;         /* 模型操作者身份色 */
  --hx-model-weak: rgba(79,95,214,.10);
  --hx-model-line: rgba(79,95,214,.55);
  --hx-focus: #16171b;

  /* 端口数据类型色（白底上均 ≥ 3:1） */
  --hx-type-any: #80848d;
  --hx-type-ctx: #9f7a0e;
  --hx-type-ref: #2f75c0;
  --hx-type-list: #13897a;
  --hx-type-tool: #c35f3c;
  --hx-type-gen: #6f6a5e;
  --hx-type-ctrl: #c24774;
  --hx-type-state: #7656b8;

  /* 画布 */
  --hx-grid-dot: rgba(24,24,32,.14);
  --hx-marquee: rgba(24,24,32,.05);       /* 框选：中性色，模型色只表示模型 */
  --hx-marquee-line: rgba(24,24,32,.38);
  --hx-scrim: rgba(243,243,241,.7);

  /* 阴影：浅色下是层级的主要手段，必须细腻 */
  --hx-shadow-node: 0 0 0 1px rgba(24,24,32,.02), 0 1px 2px rgba(24,24,32,.06), 0 3px 10px rgba(24,24,32,.05);
  --hx-shadow-node-drag: 0 2px 4px rgba(24,24,32,.06), 0 16px 36px rgba(24,24,32,.14);
  --hx-shadow-float: 0 0 0 1px var(--hx-line-2), 0 2px 4px rgba(24,24,32,.04), 0 12px 32px rgba(24,24,32,.09);
  --hx-shadow-pop: 0 0 0 1px var(--hx-line-3), 0 4px 8px rgba(24,24,32,.06), 0 20px 48px rgba(24,24,32,.16);
}

/* ---------------- 深色（可选） ---------------- */
[data-theme="dark"] {
  color-scheme: dark;
  --hx-bg-0: #0a0b0e;
  --hx-bg-1: #101217;
  --hx-bg-2: #15171d;
  --hx-bg-3: #1b1e25;
  --hx-bg-4: #22262e;
  --hx-bg-5: #2a2f39;
  --hx-line-1: rgba(255,255,255,.055);
  --hx-line-2: rgba(255,255,255,.09);
  --hx-line-3: rgba(255,255,255,.15);
  --hx-highlight: rgba(255,255,255,.04);
  --hx-text-1: #ecebe6;
  --hx-text-2: #a7aab2;
  --hx-text-3: #7a7e88;
  --hx-text-inv: #121317;
  --hx-accent: #f5a524;
  --hx-accent-strong: #f5a524;
  --hx-accent-weak: rgba(245,165,36,.14);
  --hx-accent-line: rgba(245,165,36,.45);
  --hx-ok: #5fc48a;
  --hx-ok-weak: rgba(95,196,138,.14);
  --hx-danger: #ec6a6f;
  --hx-danger-weak: rgba(236,106,111,.14);
  --hx-wait: #e9c46a;
  --hx-wait-weak: rgba(233,196,106,.14);
  --hx-model: #93a5ff;
  --hx-model-weak: rgba(147,165,255,.14);
  --hx-model-line: rgba(147,165,255,.5);
  --hx-focus: #ecebe6;
  --hx-type-any: #7e828c;
  --hx-type-ctx: #e3c46b;
  --hx-type-ref: #6fa8dc;
  --hx-type-list: #4fb6a5;
  --hx-type-tool: #d98e73;
  --hx-type-gen: #cbc7bd;
  --hx-type-ctrl: #e07b9a;
  --hx-type-state: #a58bd6;
  --hx-grid-dot: rgba(255,255,255,.075);
  --hx-marquee: rgba(255,255,255,.06);
  --hx-marquee-line: rgba(255,255,255,.38);
  --hx-scrim: rgba(6,7,9,.6);
  --hx-shadow-node: inset 0 1px 0 var(--hx-highlight), 0 1px 2px rgba(0,0,0,.45), 0 4px 14px rgba(0,0,0,.25);
  --hx-shadow-node-drag: inset 0 1px 0 var(--hx-highlight), 0 14px 34px rgba(0,0,0,.55);
  --hx-shadow-float: inset 0 1px 0 var(--hx-highlight), 0 0 0 1px var(--hx-line-2), 0 12px 32px rgba(0,0,0,.45);
  --hx-shadow-pop: inset 0 1px 0 var(--hx-highlight), 0 0 0 1px var(--hx-line-3), 0 18px 48px rgba(0,0,0,.6);
}

/* ---------------- 与主题无关的令牌 ---------------- */
:root {
  --hx-font-ui: "Geist", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --hx-font-mono: "Geist Mono", "JetBrains Mono", "SFMono-Regular", Consolas, monospace;

  /* 字号：只允许这 8 档 */
  --hx-fs-10: 10.5px; --hx-fs-11: 11px; --hx-fs-12: 12px; --hx-fs-13: 13px;
  --hx-fs-14: 14px;   --hx-fs-16: 16px; --hx-fs-20: 20px; --hx-fs-28: 28px;

  /* 间距：4 的倍数 */
  --hx-s-1: 2px; --hx-s-2: 4px; --hx-s-3: 6px; --hx-s-4: 8px; --hx-s-5: 12px;
  --hx-s-6: 16px; --hx-s-7: 20px; --hx-s-8: 24px; --hx-s-9: 32px; --hx-s-10: 48px;

  /* 圆角 */
  --hx-r-xs: 3px; --hx-r-sm: 5px; --hx-r-md: 7px; --hx-r-lg: 10px; --hx-r-xl: 14px; --hx-r-full: 999px;

  /* 尺寸 */
  --hx-node-w: 236px; --hx-node-w-sm: 184px; --hx-node-head: 38px; --hx-node-row: 24px;
  --hx-node-widget: 28px; --hx-port: 10px; --hx-ctl-h: 28px; --hx-ctl-h-sm: 24px; --hx-grid: 20px;

  /* 动效 */
  --hx-ease: cubic-bezier(.2,.8,.2,1);
  --hx-ease-out: cubic-bezier(.16,1,.3,1);
  --hx-ease-in: cubic-bezier(.4,0,1,1);
  --hx-t-1: 90ms; --hx-t-2: 160ms; --hx-t-3: 240ms; --hx-t-4: 380ms;
}

@media (prefers-reduced-motion: reduce) {
  :root { --hx-t-1: 0ms; --hx-t-2: 0ms; --hx-t-3: 0ms; --hx-t-4: 0ms; }
}

/* ---- 设计规范_v0.3/src/02_base.css ---- */

/* ===== 02_base.css · 重置与应用骨架 ===== */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--hx-bg-0);color:var(--hx-text-1);font-family:var(--hx-font-ui);font-size:var(--hx-fs-13);line-height:1.5;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
svg{display:block}
::selection{background:var(--hx-bg-5)}
.sp{flex:1 1 auto}
.mono{font-family:var(--hx-font-mono);font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-thumb{background:var(--hx-bg-5);border-radius:10px;border:3px solid transparent;background-clip:content-box}
*::-webkit-scrollbar-track{background:transparent}

/* ---------- 应用：侧栏 + 主区 ---------- */
.hx-app{display:grid;grid-template-columns:56px minmax(0,1fr);height:100vh}
.hx-rail{display:flex;flex-direction:column;align-items:center;gap:var(--hx-s-2);padding:var(--hx-s-5) 0;
  background:var(--hx-bg-0);border-right:1px solid var(--hx-line-1)}
.hx-rail__logo{width:28px;height:28px;border-radius:8px;margin-bottom:var(--hx-s-5);display:grid;place-items:center;
  background:var(--hx-text-1);color:var(--hx-bg-0);font:600 var(--hx-fs-14)/1 var(--hx-font-ui);letter-spacing:-.02em}
.hx-rail__btn{width:36px;height:36px;border-radius:var(--hx-r-md);display:grid;place-items:center;color:var(--hx-text-3);
  transition:background-color var(--hx-t-1) var(--hx-ease),color var(--hx-t-1) var(--hx-ease)}
.hx-rail__btn svg{width:18px;height:18px}
.hx-rail__btn:hover{background:var(--hx-bg-3);color:var(--hx-text-1)}
.hx-rail__btn.is-on{background:var(--hx-bg-3);color:var(--hx-text-1);box-shadow:inset 0 1px 0 var(--hx-highlight),0 0 0 1px var(--hx-line-1)}
.hx-rail__sep{width:20px;height:1px;background:var(--hx-line-2);margin:var(--hx-s-3) 0}

.hx-main{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--hx-bg-0)}
.hx-chathead{height:48px;flex:none;display:flex;align-items:center;gap:var(--hx-s-4);padding:0 var(--hx-s-6) 0 var(--hx-s-7);
  border-bottom:1px solid var(--hx-line-1)}
.hx-chathead__title{font-size:var(--hx-fs-14);font-weight:500;letter-spacing:-.005em}
.hx-chathead__sub{font-size:var(--hx-fs-12);color:var(--hx-text-3)}

/* ---------- 对话 ---------- */
.hx-chat{flex:1;min-height:0;overflow-y:auto;padding:var(--hx-s-9) 0 var(--hx-s-6)}
.hx-msg{max-width:880px;margin:0 auto var(--hx-s-8);padding:0 var(--hx-s-8);display:flex;gap:var(--hx-s-5)}
.hx-msg__av{width:24px;height:24px;flex:none;border-radius:7px;display:grid;place-items:center;margin-top:1px;
  background:var(--hx-bg-3);color:var(--hx-text-2);font:600 var(--hx-fs-10)/1 var(--hx-font-mono);
  box-shadow:inset 0 1px 0 var(--hx-highlight),0 0 0 1px var(--hx-line-2)}
.hx-msg__body{flex:1;min-width:0;line-height:1.7}
.hx-msg__body p{margin:0 0 var(--hx-s-4)}
.hx-msg__body p:last-child{margin-bottom:0}
.hx-msg.is-user{justify-content:flex-end}
.hx-msg.is-user .hx-msg__body{flex:0 1 auto;max-width:72%;padding:var(--hx-s-4) var(--hx-s-6);border-radius:var(--hx-r-lg);
  background:var(--hx-bg-3);box-shadow:inset 0 1px 0 var(--hx-highlight),0 0 0 1px var(--hx-line-1)}
.hx-msg.is-model .hx-msg__av{color:var(--hx-model);background:var(--hx-model-weak);box-shadow:0 0 0 1px var(--hx-model-line)}
.hx-msg code,.hx-msg .k{font-family:var(--hx-font-mono);font-size:var(--hx-fs-12);color:var(--hx-text-2);
  background:var(--hx-bg-3);padding:1px 5px;border-radius:var(--hx-r-xs);box-shadow:0 0 0 1px var(--hx-line-1)}
.hx-msg__acts{display:flex;gap:var(--hx-s-3);margin-top:var(--hx-s-4)}
.hx-msg.is-enter{animation:hxMsgIn var(--hx-t-3) var(--hx-ease-out)}
@keyframes hxMsgIn{from{opacity:0;transform:translateY(6px)}}
.hx-typing{display:inline-flex;gap:4px;padding:6px 0}
.hx-typing i{width:5px;height:5px;border-radius:50%;background:var(--hx-text-3);animation:hxDot 1s var(--hx-ease) infinite}
.hx-typing i:nth-child(2){animation-delay:.15s}.hx-typing i:nth-child(3){animation-delay:.3s}
@keyframes hxDot{0%,80%,100%{opacity:.25;transform:none}40%{opacity:1;transform:translateY(-2px)}}

/* ---------- 对话中的画布卡片（只读缩略） ---------- */
.hx-card{margin-top:var(--hx-s-5);border-radius:var(--hx-r-xl);background:var(--hx-bg-2);box-shadow:var(--hx-shadow-float);overflow:hidden;
  transition:opacity var(--hx-t-2) var(--hx-ease)}
.hx-card.is-away{opacity:0}
.hx-card__head{height:44px;display:flex;align-items:center;gap:var(--hx-s-4);padding:0 var(--hx-s-5) 0 var(--hx-s-6);
  border-bottom:1px solid var(--hx-line-1)}
.hx-card__ico{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;background:var(--hx-bg-5);color:var(--hx-text-2)}
.hx-card__ico svg{width:13px;height:13px}
.hx-card__title{font-weight:500}
.hx-card__sub{color:var(--hx-text-3);font-size:var(--hx-fs-12)}
.hx-card__view{position:relative;height:320px;cursor:zoom-in;background-color:var(--hx-bg-1);
  background-image:radial-gradient(circle,var(--hx-grid-dot) 1px,transparent 1.3px);background-size:20px 20px}
.hx-card__view canvas{position:absolute;inset:0;width:100%;height:100%}
.hx-card__view:hover .hx-card__hint{opacity:1;transform:none}
.hx-card__hint{position:absolute;right:var(--hx-s-5);bottom:var(--hx-s-5);opacity:0;transform:translateY(4px);
  transition:opacity var(--hx-t-2) var(--hx-ease),transform var(--hx-t-2) var(--hx-ease)}
.hx-card__foot{height:48px;display:flex;align-items:center;gap:var(--hx-s-5);padding:0 var(--hx-s-4) 0 var(--hx-s-6);
  border-top:1px solid var(--hx-line-1);color:var(--hx-text-2);font-size:var(--hx-fs-12)}

/* ---------- 输入框 ---------- */
.hx-composer{flex:none;position:relative;z-index:40;padding:var(--hx-s-4) var(--hx-s-8) var(--hx-s-6);background:var(--hx-bg-0)}
.hx-composer>*{max-width:880px;margin-left:auto;margin-right:auto}
.hx-chips{display:flex;flex-wrap:wrap;gap:var(--hx-s-3);margin-bottom:var(--hx-s-4)}
.hx-composer__box{background:var(--hx-bg-2);border-radius:var(--hx-r-xl);padding:var(--hx-s-4) var(--hx-s-4) var(--hx-s-4) var(--hx-s-6);
  box-shadow:var(--hx-shadow-float);transition:box-shadow var(--hx-t-2) var(--hx-ease)}
.hx-composer__box:focus-within{box-shadow:inset 0 1px 0 var(--hx-highlight),0 0 0 1px var(--hx-line-3),0 12px 32px rgba(0,0,0,.28)}
.hx-composer textarea{display:block;width:100%;height:42px;resize:none;border:0;outline:0;background:transparent;padding:var(--hx-s-1) 0;
  font-size:var(--hx-fs-14);line-height:1.55}
.hx-composer textarea::placeholder{color:var(--hx-text-3)}
.hx-composer__row{display:flex;align-items:center;gap:var(--hx-s-4)}
.hx-composer__hint{font-size:var(--hx-fs-12);color:var(--hx-text-3);display:flex;align-items:center;gap:var(--hx-s-3)}

/* ---------- 舞台（展开 / 全屏态的画布容器） ---------- */
.hx-stage{position:absolute;left:0;right:0;top:0;bottom:var(--hx-composer-h,120px);z-index:30;display:flex;flex-direction:column;
  background:var(--hx-bg-1);transform-origin:0 0;overflow:hidden;box-shadow:0 1px 0 var(--hx-line-1)}
.hx-stage.is-full{position:fixed;inset:0;z-index:70}

/* 头部 */
.hx-node__head{height:var(--hx-node-head);display:flex;align-items:center;gap:var(--hx-s-4);padding:0 var(--hx-s-4) 0 var(--hx-s-5);

  background:var(--hx-model-weak);color:var(--hx-model);font:600 var(--hx-fs-10)/1 var(--hx-font-mono);letter-spacing:.04em}

/* 端口 */

/* 内联控件 */
.hx-node__widgets{display:flex;flex-direction:column;padding:var(--hx-s-2) var(--hx-s-5) var(--hx-s-4);border-top:1px solid var(--hx-line-1)}

.hx-step input{width:100%;height:100%;border:0;outline:0;background:var(--hx-bg-2);text-align:center;font:500 var(--hx-fs-12) var(--hx-font-mono)}

/* 下拉 */
.hx-select{width:100%;height:var(--hx-ctl-h-sm);display:flex;align-items:center;gap:var(--hx-s-2);padding:0 var(--hx-s-2) 0 var(--hx-s-3);border-radius:var(--hx-r-sm);
  background:var(--hx-bg-4);font-size:var(--hx-fs-12);color:var(--hx-text-1);text-align:left;transition:box-shadow var(--hx-t-1)}
.hx-select:hover{box-shadow:0 0 0 1px var(--hx-line-3)}
.hx-select span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--hx-font-mono)}
.hx-select svg{width:11px;height:11px;color:var(--hx-text-3);flex:none}
.hx-select.is-lg,.hx-step.is-lg{height:var(--hx-ctl-h)}
.hx-step.is-lg .hx-step__v{line-height:var(--hx-ctl-h)}

/* 分段控件（选中背景滑动） */
.hx-seg{position:relative;display:inline-flex;padding:2px;border-radius:var(--hx-r-md);background:var(--hx-bg-4);gap:0;isolation:isolate}
.hx-seg button{position:relative;z-index:1;height:22px;padding:0 var(--hx-s-4);border-radius:var(--hx-r-sm);font-size:var(--hx-fs-12);color:var(--hx-text-3);white-space:nowrap;
  transition:color var(--hx-t-2) var(--hx-ease)}
.hx-seg button:hover{color:var(--hx-text-1)}
.hx-seg button.is-on{color:var(--hx-text-1);font-weight:500}
.hx-seg__thumb{position:absolute;z-index:0;top:2px;bottom:2px;left:0;border-radius:var(--hx-r-sm);background:var(--hx-bg-2);
  box-shadow:0 0 0 1px var(--hx-line-2),0 1px 2px rgba(0,0,0,.08);transition:transform var(--hx-t-2) var(--hx-ease),width var(--hx-t-2) var(--hx-ease)}
.hx-seg.is-fill{display:flex;width:100%}
.hx-seg.is-fill button{flex:1;padding:0 2px;font-size:var(--hx-fs-11)}
.hx-seg.is-mono button{font-family:var(--hx-font-mono)}

/* 开关 */
.hx-switch{position:relative;width:28px;height:16px;flex:none;border-radius:var(--hx-r-full);background:var(--hx-bg-5);transition:background-color var(--hx-t-2) var(--hx-ease)}
.hx-switch::after{content:"";position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--hx-bg-2);box-shadow:0 1px 2px rgba(0,0,0,.2);
  transition:transform var(--hx-t-2) var(--hx-ease)}
.hx-switch.is-on{background:var(--hx-accent)}
.hx-switch.is-on::after{transform:translateX(12px)}
.hx-switch[disabled]{opacity:.5;pointer-events:none}

/* 滑块 */
.hx-slider{position:relative;width:100%;height:var(--hx-ctl-h-sm);display:flex;align-items:center;gap:var(--hx-s-4);cursor:pointer}
.hx-slider__trk{position:relative;flex:1;height:4px;border-radius:4px;background:var(--hx-bg-5)}
.hx-slider__fill{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--hx-text-2);width:calc(var(--v) * 100%)}
.hx-slider__thumb{position:absolute;top:50%;left:calc(var(--v) * 100%);width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--hx-bg-2);
  box-shadow:0 0 0 1px var(--hx-line-3),0 1px 3px rgba(0,0,0,.2);transition:transform var(--hx-t-1) var(--hx-ease)}
.hx-slider:hover .hx-slider__thumb,.hx-slider.is-drag .hx-slider__thumb{transform:scale(1.15)}
.hx-slider__v{width:34px;text-align:right;font:500 var(--hx-fs-11)/1 var(--hx-font-mono);color:var(--hx-text-2);font-variant-numeric:tabular-nums}

/* 徽标、状态 */
.hx-badge{height:18px;display:inline-flex;align-items:center;gap:4px;padding:0 6px;border-radius:var(--hx-r-xs);white-space:nowrap;
  font:500 var(--hx-fs-10)/1 var(--hx-font-mono);color:var(--hx-text-2);background:var(--hx-bg-4)}
.hx-badge.is-run{background:var(--hx-accent-weak);color:var(--hx-accent-strong)}
.hx-badge.is-ok{background:var(--hx-ok-weak);color:var(--hx-ok)}
.hx-badge.is-bad{background:var(--hx-danger-weak);color:var(--hx-danger)}
.hx-badge.is-wait{background:var(--hx-wait-weak);color:var(--hx-wait)}
.hx-badge.is-model{background:var(--hx-model-weak);color:var(--hx-model)}
.hx-badge svg{width:10px;height:10px}

/* 提示框 */
.hx-tip{position:fixed;left:0;top:0;z-index:100;max-width:280px;padding:6px 9px;border-radius:var(--hx-r-sm);pointer-events:none;
  background:var(--hx-bg-2);color:var(--hx-text-1);font-size:var(--hx-fs-12);line-height:1.5;box-shadow:var(--hx-shadow-pop);
  display:flex;align-items:center;gap:var(--hx-s-4);animation:hxFade var(--hx-t-2) var(--hx-ease-out)}
.hx-tip.is-model{box-shadow:0 0 0 1px var(--hx-model-line),0 12px 32px rgba(0,0,0,.18)}
@keyframes hxFade{from{opacity:0;transform:translateY(2px)}}

/* 菜单 / 右键菜单 / 下拉弹层 */
.hx-menu{position:fixed;left:0;top:0;z-index:90;min-width:220px;max-height:360px;overflow-y:auto;padding:4px;border-radius:var(--hx-r-lg);
  background:var(--hx-bg-2);box-shadow:var(--hx-shadow-pop);animation:hxMenuIn var(--hx-t-3) var(--hx-ease-out);transform-origin:top left}
@keyframes hxMenuIn{from{opacity:0;transform:scale(.97) translateY(-2px)}}
.hx-menu__h{padding:8px 10px 4px;font-size:var(--hx-fs-11);color:var(--hx-text-3);font-weight:500}
.hx-menu__i{width:100%;height:28px;display:flex;align-items:center;gap:var(--hx-s-4);padding:0 var(--hx-s-4);border-radius:var(--hx-r-sm);font-size:var(--hx-fs-13);text-align:left;color:var(--hx-text-1)}
.hx-menu__i svg{width:14px;height:14px;color:var(--hx-text-3);flex:none}
.hx-menu__i kbd{margin-left:auto;background:transparent;box-shadow:none}
.hx-menu__i:hover,.hx-menu__i.is-act{background:var(--hx-bg-4)}
.hx-menu__i.is-danger{color:var(--hx-danger)}
.hx-menu__i.is-danger svg{color:var(--hx-danger)}
.hx-menu__i.is-on::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--hx-text-1);margin-left:auto}
.hx-menu__i[disabled]{opacity:.4;pointer-events:none}
.hx-menu__sep{height:1px;margin:4px 6px;background:var(--hx-line-1)}
.hx-menu__d{display:block;font-size:var(--hx-fs-11);color:var(--hx-text-3);line-height:1.35}
.hx-menu__i.is-2l{height:auto;padding:6px 8px;align-items:flex-start}

/* 命令面板 */
.hx-overlay{position:fixed;inset:0;z-index:95;background:var(--hx-scrim);display:flex;justify-content:center;align-items:flex-start;padding-top:14vh;
  animation:hxFade var(--hx-t-2) var(--hx-ease-out)}
.hx-cmdk{width:560px;max-width:calc(100vw - 32px);border-radius:var(--hx-r-xl);background:var(--hx-bg-2);box-shadow:var(--hx-shadow-pop);overflow:hidden;
  animation:hxMenuIn var(--hx-t-3) var(--hx-ease-out)}
.hx-cmdk__in{display:flex;align-items:center;gap:var(--hx-s-4);height:52px;padding:0 var(--hx-s-6);border-bottom:1px solid var(--hx-line-1)}
.hx-cmdk__in svg{width:16px;height:16px;color:var(--hx-text-3)}
.hx-cmdk__in input{flex:1;border:0;outline:0;background:transparent;font-size:var(--hx-fs-16)}
.hx-cmdk__in input::placeholder{color:var(--hx-text-3)}
.hx-cmdk__list{max-height:380px;overflow-y:auto;padding:6px}
.hx-cmdk__foot{display:flex;gap:var(--hx-s-6);padding:8px var(--hx-s-6);border-top:1px solid var(--hx-line-1);font-size:var(--hx-fs-11);color:var(--hx-text-3)}

/* 快速添加（拖线到空白处） */
.hx-quick{position:fixed;left:0;top:0;z-index:90;width:260px;border-radius:var(--hx-r-lg);background:var(--hx-bg-2);box-shadow:var(--hx-shadow-pop);overflow:hidden;
  animation:hxMenuIn var(--hx-t-3) var(--hx-ease-out)}
.hx-quick__h{display:flex;align-items:center;gap:var(--hx-s-3);padding:8px 10px 0;font-size:var(--hx-fs-11);color:var(--hx-text-3)}
.hx-quick__h i{width:8px;height:8px;border-radius:50%;background:var(--pc)}
.hx-quick .hx-input{margin:6px 8px 0;width:calc(100% - 16px)}
.hx-quick .hx-menu{position:static;box-shadow:none;animation:none;border-radius:0;max-height:260px}

/* 通知 */
.hx-toasts{position:fixed;right:16px;top:64px;z-index:96;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.hx-toast{width:320px;display:flex;align-items:flex-start;gap:var(--hx-s-4);padding:10px 10px 10px 12px;border-radius:var(--hx-r-lg);pointer-events:auto;
  background:var(--hx-bg-2);box-shadow:var(--hx-shadow-pop);font-size:var(--hx-fs-13);line-height:1.5;
  animation:hxToastIn var(--hx-t-3) var(--hx-ease-out);transition:opacity var(--hx-t-2) var(--hx-ease-in),transform var(--hx-t-2) var(--hx-ease-in)}
.hx-toast.is-out{opacity:0;transform:translateX(12px)}
@keyframes hxToastIn{from{opacity:0;transform:translateX(16px)}}
.hx-toast__i{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none;background:var(--hx-text-3)}
.hx-toast.is-model .hx-toast__i{background:var(--hx-model)}
.hx-toast.is-ok .hx-toast__i{background:var(--hx-ok)}
.hx-toast.is-bad .hx-toast__i{background:var(--hx-danger)}
.hx-toast.is-wait .hx-toast__i{background:var(--hx-wait)}
.hx-toast__b{flex:1;min-width:0}
.hx-toast__b small{display:block;color:var(--hx-text-3);font-size:var(--hx-fs-12)}
.hx-pop{position:fixed;z-index:90;width:300px;padding:6px;border-radius:var(--hx-r-lg);background:var(--hx-bg-2);box-shadow:var(--hx-shadow-pop);
  animation:hxMenuIn var(--hx-t-3) var(--hx-ease-out)}
.hx-pop.is-wide{width:380px}
.hx-pop__h{padding:8px 10px;font-size:var(--hx-fs-12);color:var(--hx-text-3);display:flex;align-items:center;gap:6px}
.hx-pitem{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center;padding:8px 10px;border-radius:var(--hx-r-md);font-size:var(--hx-fs-12)}
.hx-pitem:hover{background:var(--hx-bg-4)}
.hx-pitem b{display:block;font-weight:500;font-size:var(--hx-fs-13)}
.hx-pitem span{color:var(--hx-text-3)}

/* ---- 设计规范_v0.3/src/07_extra.css ---- */

/* ===== 07_extra.css · 补充规则 ===== */
.hx-seg:not(:has(.hx-seg__thumb)) button.is-on{background:var(--hx-bg-2);box-shadow:0 0 0 1px var(--hx-line-2),0 1px 2px rgba(0,0,0,.08)}
.hx-node .hx-seg{background:var(--hx-bg-4)}
.hx-menu__i .hx-node__ico{width:22px;height:22px;flex:none}
.hx-menu__i .hx-node__ico svg{width:13px;height:13px;color:var(--hx-text-2)}
.hx-libfab{width:36px;height:36px;border-radius:var(--hx-r-md)}
.hx-composer__hint svg{flex:none}
.hx-stage:focus-within .hx-viewport{outline:0}
.hx-viewport:focus-visible{box-shadow:inset 0 0 0 1px var(--hx-line-3)}
[data-theme="dark"] .hx-seg__thumb{box-shadow:inset 0 1px 0 var(--hx-highlight),0 0 0 1px var(--hx-line-2)}

/* ---- 布局demo_v0.4/src/08_layout.css ---- */

/* ===== 08_layout.css · v0.4 布局：顶部条 + 左侧栏 + 画布（满铺）+ 右侧栏（默认收起）+ 底部居中对话框 =====
   只覆盖布局，不改组件本身的视觉规范；所有数值来自 tokens.css。 */

/* ---------- 应用骨架 ---------- */
.hx-app.hx-l4{display:flex;flex-direction:column;height:100vh;grid-template-columns:none;background:var(--hx-bg-0)}
.hx-l4top{flex:none;height:48px;gap:var(--hx-s-3);padding:0 var(--hx-s-4)}
.hx-l4logo{width:24px;height:24px;flex:none;display:grid;place-items:center;border-radius:var(--hx-r-sm);background:var(--hx-text-1);color:var(--hx-bg-0);
  font:600 var(--hx-fs-12)/1 var(--hx-font-ui)}
.hx-l4title{font-size:var(--hx-fs-13);font-weight:600;white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.hx-l4top .hx-crumb{flex:0 1 auto}
#rsToggle.has-dot{position:relative}
#rsToggle.has-dot::after{content:"";position:absolute;right:5px;top:5px;width:6px;height:6px;border-radius:50%;background:var(--hx-accent);box-shadow:0 0 0 2px var(--hx-bg-0)}
#rsToggle.is-on,#lsToggle.is-on{background:var(--hx-bg-4);color:var(--hx-text-1)}

.hx-shell{flex:1;min-height:0;display:grid;grid-template-columns:var(--hx-ls-w,264px) minmax(0,1fr) var(--hx-rs-w,0px)}
.hx-shell.ls-min{--hx-ls-w:56px}
.hx-shell.rs-open{--hx-rs-w:340px}

/* 中间画布：不再是浮层舞台，而是网格里的一格 */
.hx-l4 .hx-main{min-width:0;min-height:0;border-left:1px solid var(--hx-line-1);border-right:1px solid var(--hx-line-1)}
.hx-shell:not(.rs-open) .hx-main{border-right:0}
.hx-l4 .hx-stage{position:relative;inset:auto;left:auto;right:auto;top:auto;bottom:auto;flex:1;height:100%;z-index:auto;background:var(--hx-bg-1)}
.hx-l4 .hx-stage .hx-body{height:100%}

/* ---------- 左侧栏 ---------- */
.hx-ls{min-width:0;min-height:0;display:flex;background:var(--hx-bg-0)}
.hx-ls__rail{display:none;width:56px;flex:none;flex-direction:column;align-items:center;gap:var(--hx-s-2);padding:var(--hx-s-4) 0}
.hx-ls__full{flex:1;min-width:0;display:flex;flex-direction:column;animation:hxSideIn var(--hx-t-3) var(--hx-ease-out)}
.hx-shell.ls-min .hx-ls__rail{display:flex}
.hx-shell.ls-min .hx-ls__full{display:none}
@keyframes hxSideIn{from{opacity:0;transform:translateX(-8px)}}
@keyframes hxSideInR{from{opacity:0;transform:translateX(8px)}}

.hx-ls__new{padding:var(--hx-s-4) var(--hx-s-4) var(--hx-s-2)}
.hx-ls__newbtn{width:100%;justify-content:center}
.hx-ls__sec{display:flex;flex-direction:column;min-height:0;border-top:1px solid var(--hx-line-1)}
.hx-ls__sec:first-of-type{border-top:0}
.hx-ls__sec.is-grow{flex:1}
.hx-ls__sec.is-closed{flex:none}
.hx-ls__sec.is-closed>:not(.hx-ls__sech){display:none}
.hx-ls__sech{height:34px;flex:none;display:flex;align-items:center;gap:var(--hx-s-3);padding:0 var(--hx-s-5);font-size:var(--hx-fs-11);font-weight:500;color:var(--hx-text-3)}
.hx-ls__sech svg{width:12px;height:12px;margin-left:auto;transition:transform var(--hx-t-2) var(--hx-ease)}
.hx-ls__sec.is-closed .hx-ls__sech svg{transform:rotate(-90deg)}
.hx-ls__sech:hover{color:var(--hx-text-1)}

.hx-sess{max-height:236px;overflow-y:auto;padding:0 var(--hx-s-3) var(--hx-s-3)}
.hx-sess__item{width:100%;display:flex;flex-direction:column;gap:2px;padding:var(--hx-s-3) var(--hx-s-4);border-radius:var(--hx-r-sm);text-align:left;
  transition:background-color var(--hx-t-1) var(--hx-ease)}
.hx-sess__item:hover{background:var(--hx-bg-3)}
.hx-sess__item.is-cur{background:var(--hx-bg-4)}
.hx-sess__t{font-size:var(--hx-fs-13);color:var(--hx-text-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hx-sess__m{display:flex;align-items:center;gap:var(--hx-s-2);font:400 var(--hx-fs-11)/1.3 var(--hx-font-mono);color:var(--hx-text-3)}
.hx-sess__m svg{width:11px;height:11px}
.hx-sess__m .is-run{color:var(--hx-accent-strong)}

/* 节点库：从浮动面板改为侧栏内容 */
.hx-l4 .hx-lib{position:static;inset:auto;width:auto;flex:1;min-height:0;display:flex;flex-direction:column;background:transparent;box-shadow:none;border-radius:0;
  transform:none;opacity:1;pointer-events:auto}
.hx-l4 .hx-lib.is-collapsed{transform:none;opacity:1;pointer-events:auto}
.hx-l4 .hx-lib__search{margin:0 var(--hx-s-4) var(--hx-s-2)}
.hx-l4 .hx-libfab{display:none}

.hx-ls__foot{flex:none;border-top:1px solid var(--hx-line-1);padding:var(--hx-s-3)}
.hx-ls__me{width:100%;height:36px;display:flex;align-items:center;gap:var(--hx-s-4);padding:0 var(--hx-s-3);border-radius:var(--hx-r-sm);font-size:var(--hx-fs-12);color:var(--hx-text-2)}
.hx-ls__me:hover{background:var(--hx-bg-3);color:var(--hx-text-1)}
.hx-ls__me svg{width:14px;height:14px}
.hx-ls__av{width:22px;height:22px;display:grid;place-items:center;border-radius:50%;background:var(--hx-bg-5);color:var(--hx-text-1);font-size:var(--hx-fs-11);font-weight:600}

/* ---------- 右侧栏（默认收起） ---------- */
.hx-rs{min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--hx-bg-0);overflow:hidden}
.hx-rs.is-collapsed{display:none}
.hx-rs:not(.is-collapsed){animation:hxSideInR var(--hx-t-3) var(--hx-ease-out)}
.hx-rs__head{height:44px;flex:none;display:flex;align-items:center;gap:var(--hx-s-3);padding:0 var(--hx-s-3) 0 var(--hx-s-4);border-bottom:1px solid var(--hx-line-1)}
.hx-rs__head .hx-seg{flex:1}
.hx-rs__pane{flex:1;min-height:0;display:flex;flex-direction:column}
.hx-rs__pane[hidden]{display:none}

/* 检查器：从浮动面板改为侧栏内容；未选中时显示空状态 */
.hx-l4 .hx-insp{position:static;inset:auto;width:auto;flex:1;min-height:0;background:transparent;box-shadow:none;border-radius:0;transform:none;opacity:1;pointer-events:auto}
.hx-l4 .hx-insp.is-off{transform:none;opacity:1;pointer-events:auto}
.hx-l4 .hx-insp.is-off>*{display:none}
.hx-l4 .hx-insp.is-off::before{content:"在画布上选中一个节点或一条连线，这里显示它的参数、端口、运行信息和模型记录。\A\A没有选中时，按 I 也能打开这里。";white-space:pre-line;
  padding:var(--hx-s-7) var(--hx-s-6);font-size:var(--hx-fs-12);line-height:1.7;color:var(--hx-text-3)}

/* 对话记录 */
.hx-l4 .hx-chat{flex:1;padding:var(--hx-s-5) 0}
.hx-l4 .hx-chat .hx-msg{max-width:none;padding:0 var(--hx-s-5);margin-bottom:var(--hx-s-6);font-size:var(--hx-fs-13)}
.hx-l4 .hx-chat .hx-msg.is-user .hx-msg__body{max-width:86%}

/* 运行抽屉：放进右侧栏「运行」 */
.hx-l4 .hx-drawer{height:auto;flex:1;min-height:0;border-top:0}
.hx-l4 .hx-drawer.is-min{height:auto}
.hx-l4 .hx-drawer__grip{display:none}
.hx-l4 .hx-drawer__head{height:auto;flex-wrap:wrap;row-gap:var(--hx-s-3);padding:var(--hx-s-4)}
.hx-l4 .hx-metrics{width:100%;flex-wrap:wrap;row-gap:var(--hx-s-2)}
.hx-l4 .hx-metrics .is-path{max-width:100%}
.hx-l4 .hx-tl__row{grid-template-columns:116px minmax(0,1fr)}
.hx-l4 .hx-tl__lbl{padding:0 var(--hx-s-3) 0 var(--hx-s-4)}
.hx-l4 .hx-tl__trk{margin-right:var(--hx-s-4)}
.hx-l4 .hx-log div{grid-template-columns:46px minmax(0,1fr);gap:0 var(--hx-s-3);padding:var(--hx-s-1) var(--hx-s-4)}
.hx-l4 .hx-log div>:nth-child(3){grid-column:2}
.hx-l4 .hx-hist__row{grid-template-columns:44px 44px minmax(0,1fr) auto;gap:var(--hx-s-3);padding:var(--hx-s-2) var(--hx-s-4)}

/* ---------- 画布内的浮动件 ---------- */
/* 停靠栏移到顶部居中，底部让给对话框 */
.hx-l4 .hx-dock{top:12px;bottom:auto}
.hx-l4 .hx-banner{top:64px}
.hx-l4 .hx-mini{left:12px;bottom:12px}
.hx-l4 .hx-fps{right:12px;bottom:auto;top:12px}

/* 对话输入框：画布底部居中，宽度随画布变化 */
.hx-l4comp.hx-composer{position:absolute;left:50%;bottom:16px;z-index:12;transform:translateX(-50%);
  width:min(720px,calc(100% - 460px));min-width:min(440px,calc(100% - 24px));
  padding:var(--hx-s-3);background:var(--hx-bg-2);border-radius:var(--hx-r-xl);box-shadow:var(--hx-shadow-float)}
.hx-l4comp.hx-composer>*{max-width:none}
.hx-l4comp .hx-chips{flex-wrap:nowrap;overflow-x:auto;margin:0 0 var(--hx-s-3);padding:0 var(--hx-s-1);scrollbar-width:none}
.hx-l4comp .hx-chips::-webkit-scrollbar{display:none}
.hx-l4comp .hx-chip{flex:none}
.hx-l4comp .hx-composer__box{box-shadow:none;background:var(--hx-bg-3);border-radius:var(--hx-r-lg)}
.hx-l4comp:focus-within .hx-composer__box{box-shadow:0 0 0 1px var(--hx-line-3)}
.hx-l4ctx{display:inline-flex;align-items:center;gap:var(--hx-s-2);min-width:0;font-size:var(--hx-fs-11);color:var(--hx-text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hx-l4ctx b{font-weight:500;color:var(--hx-text-1);background:var(--hx-bg-5);border-radius:var(--hx-r-xs);padding:2px 6px;font-family:var(--hx-font-mono)}
.hx-l4model{display:inline-flex;align-items:center;gap:var(--hx-s-2);font-size:var(--hx-fs-11);color:var(--hx-text-3);margin-right:var(--hx-s-3);white-space:nowrap}
.hx-l4model svg{width:12px;height:12px;color:var(--hx-model)}
@media (max-width:1180px){.hx-l4model{display:none}}

/* 提议栏：对话框正上方 */
.hx-l4 .hx-proposal{bottom:calc(var(--hx-comp-h,112px) + 26px)}

/* 浮动回复：对话框上方，最多 3 条；完整记录在右侧栏「对话」 */
.hx-float{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--hx-comp-h,112px) + 26px);z-index:11;
  width:min(720px,calc(100% - 460px));min-width:min(440px,calc(100% - 24px));max-height:min(46%,380px);display:flex;flex-direction:column;
  background:color-mix(in srgb,var(--hx-bg-2) 94%,transparent);transition:opacity var(--hx-t-3) var(--hx-ease-out),transform var(--hx-t-3) var(--hx-ease-out)}
.hx-float.is-empty,.hx-float.is-hidden,.hx-app.rs-chat .hx-float{opacity:0;transform:translate(-50%,8px);pointer-events:none}
.hx-viewport:has(#proposal:not([hidden])) .hx-float{bottom:calc(var(--hx-comp-h,112px) + 82px)}
.hx-float__bar{height:32px;flex:none;display:flex;align-items:center;gap:var(--hx-s-2);padding:0 var(--hx-s-2) 0 var(--hx-s-5);border-bottom:1px solid var(--hx-line-1);
  font-size:var(--hx-fs-11);color:var(--hx-text-3)}
.hx-float__all{height:22px;display:inline-flex;align-items:center;gap:2px;padding:0 var(--hx-s-3);border-radius:var(--hx-r-sm);font-size:var(--hx-fs-11);color:var(--hx-text-2)}
.hx-float__all:hover{background:var(--hx-bg-4);color:var(--hx-text-1)}
.hx-float__all svg{width:11px;height:11px}
.hx-float__list{overflow-y:auto;padding:var(--hx-s-4) 0 var(--hx-s-2)}
.hx-float .hx-msg{max-width:none;padding:0 var(--hx-s-5);margin-bottom:var(--hx-s-4);font-size:var(--hx-fs-13)}
.hx-float .hx-msg.is-user .hx-msg__body{max-width:80%}
.hx-float .hx-msg__av{width:22px;height:22px;font-size:var(--hx-fs-10)}

/* Tab 专注模式：隐藏工具类面板，但对话框和回复保留（11 号 §11.6） */
.hx-stage.is-focus .hx-l4comp,.hx-stage.is-focus .hx-float:not(.is-empty):not(.is-hidden){opacity:1;pointer-events:auto}

/* 窄屏：右侧栏改为覆盖在画布上 */
@media (max-width:1100px){
  .hx-shell.rs-open{--hx-rs-w:0px}
  .hx-rs:not(.is-collapsed){position:fixed;right:0;top:48px;bottom:0;width:340px;z-index:60;box-shadow:var(--hx-shadow-float)}
  .hx-l4comp.hx-composer,.hx-float{width:calc(100% - 24px)}
  .hx-l4 .hx-mini{display:none}
}


/* ===================== 嵌套系统（29_nest.js） ===================== */
/* 进入 / 返回：从节点位置放大进去、缩回来（transform-origin 由脚本设为节点位置） */
.hx-l4 .hx-layer.is-enter{animation:hxDive var(--hx-t-4) var(--hx-ease-out)}
.hx-l4 .hx-layer.is-leave{animation:hxSurface var(--hx-t-4) var(--hx-ease-out)}
@keyframes hxDive{from{opacity:0;transform:scale(.3)}}
@keyframes hxSurface{from{opacity:0;transform:scale(2.4)}}

/* 子图节点的缩略图：可点击预览 */
.hx-l4 .hx-node.is-sub .hx-node__thumb{cursor:zoom-in;transition:box-shadow var(--hx-t-1) var(--hx-ease)}
.hx-l4 .hx-node.is-sub .hx-node__thumb:hover{box-shadow:0 0 0 1px var(--hx-line-3)}
.hx-l4 .hx-node.is-sub .hx-node__thumb::before{content:"点击预览 · 双击进入";position:absolute;left:6px;top:5px;font:500 var(--hx-fs-10)/1 var(--hx-font-ui);
  color:var(--hx-text-2);opacity:0;transition:opacity var(--hx-t-1) var(--hx-ease);pointer-events:none}
.hx-l4 .hx-node.is-sub .hx-node__thumb:hover::before{opacity:1}

/* 结构树 */
.hx-tree{max-height:260px;overflow-y:auto;padding:0 var(--hx-s-3) var(--hx-s-3)}
.hx-tree__i{position:relative;width:100%;height:28px;display:flex;align-items:center;gap:var(--hx-s-3);
  padding:0 var(--hx-s-3) 0 calc(var(--hx-s-3) + var(--d,0) * 14px);border-radius:var(--hx-r-sm);font-size:var(--hx-fs-12);color:var(--hx-text-2);text-align:left;
  transition:background-color var(--hx-t-1) var(--hx-ease)}
.hx-tree__i::before{content:"";position:absolute;left:calc(var(--hx-s-3) + var(--d,0) * 14px - 8px);top:0;bottom:0;width:1px;background:var(--hx-line-2)}
.hx-tree__i[style*="--d:0"]::before{display:none}
.hx-tree__i:hover{background:var(--hx-bg-3);color:var(--hx-text-1)}
.hx-tree__i.is-path{color:var(--hx-text-1)}
.hx-tree__i.is-cur{background:var(--hx-bg-4);color:var(--hx-text-1);font-weight:500}
.hx-tree__i.is-ping{box-shadow:0 0 0 1.5px var(--hx-focus)}
.hx-tree__i>svg{width:13px;height:13px;flex:none;color:var(--hx-text-3)}
.hx-tree__t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hx-tree__n{font:400 var(--hx-fs-10)/1 var(--hx-font-mono);color:var(--hx-text-3)}
.hx-tree__st{width:6px;height:6px;flex:none;border-radius:50%;background:transparent}
.hx-tree__st.is-queued{box-shadow:inset 0 0 0 1px var(--hx-line-3)}
.hx-tree__st.is-running{background:var(--hx-accent);animation:hxBreath 1.2s var(--hx-ease) infinite}
.hx-tree__st.is-done{background:var(--hx-ok)}
.hx-tree__st.is-waiting{background:var(--hx-wait)}
.hx-tree__st.is-failed{background:var(--hx-danger)}
.hx-tree__pv{display:none;width:20px;height:20px;flex:none;place-items:center;border-radius:var(--hx-r-xs);color:var(--hx-text-3)}
.hx-tree__pv svg{width:12px;height:12px}
.hx-tree__pv:hover{background:var(--hx-bg-5);color:var(--hx-text-1)}
.hx-tree__i:hover .hx-tree__pv{display:grid}
.hx-tree__tip{padding:var(--hx-s-3) var(--hx-s-3) 0;font-size:var(--hx-fs-11);color:var(--hx-text-3)}

/* 父图位置卡 */
.hx-nest{left:12px;top:12px;width:236px;overflow:hidden;z-index:11}
.hx-nest__h{height:34px;display:flex;align-items:center;gap:var(--hx-s-2);padding:0 var(--hx-s-2) 0 var(--hx-s-4);font-size:var(--hx-fs-11);color:var(--hx-text-3);
  border-bottom:1px solid var(--hx-line-1)}
.hx-nest__h b{color:var(--hx-text-1);font-weight:500;font-size:var(--hx-fs-12);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hx-nest__cv{position:relative;height:100px;margin:var(--hx-s-3);border-radius:var(--hx-r-sm);background:var(--hx-bg-1);cursor:pointer}
.hx-nest__cv:hover{box-shadow:0 0 0 1px var(--hx-line-3)}
.hx-nest__cv canvas{width:100%;height:100%;pointer-events:none}
.hx-nest__io{display:grid;gap:2px;padding:0 var(--hx-s-4) var(--hx-s-4);font:400 var(--hx-fs-11)/1.5 var(--hx-font-mono);color:var(--hx-text-2)}
.hx-nest__io div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hx-nest__io em{font:normal var(--hx-fs-10)/1 var(--hx-font-ui);color:var(--hx-text-3);margin-right:var(--hx-s-3)}
.hx-nest__io b{color:var(--hx-text-1);font-weight:500}
.hx-nest.is-min .hx-nest__cv,.hx-nest.is-min .hx-nest__io{display:none}
.hx-nest.is-min .hx-nest__h{border-bottom:0}

/* 预览浮层 */
.hx-peek{z-index:14;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--hx-shadow-pop);
  transform-origin:var(--ox,50%) var(--oy,50%);animation:hxPeekIn var(--hx-t-3) var(--hx-ease-out)}
@keyframes hxPeekIn{from{opacity:0;transform:scale(.9)}}
.hx-peek__h{display:flex;align-items:center;gap:var(--hx-s-4);padding:var(--hx-s-4) var(--hx-s-3) var(--hx-s-4) var(--hx-s-5)}
.hx-peek__h .hx-node__ico{width:28px;height:28px;border-radius:7px}
.hx-peek__ttl{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;column-gap:var(--hx-s-3)}
.hx-peek__ttl b{font-size:var(--hx-fs-14);font-weight:600}
.hx-peek__ref{font:400 var(--hx-fs-11)/1 var(--hx-font-mono);color:var(--hx-text-3)}
.hx-peek__path{width:100%;font:400 var(--hx-fs-11)/1.5 var(--hx-font-mono);color:var(--hx-text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hx-peek__st.is-running{color:var(--hx-accent-strong);background:var(--hx-accent-weak)}
.hx-peek__st.is-done{color:var(--hx-ok);background:var(--hx-ok-weak)}
.hx-peek__st.is-waiting{color:var(--hx-wait);background:var(--hx-wait-weak)}
.hx-peek__st.is-failed{color:var(--hx-danger);background:var(--hx-danger-weak)}
.hx-peek__cv{position:relative;height:300px;margin:0 var(--hx-s-4);border-radius:var(--hx-r-md);background:var(--hx-bg-1);box-shadow:inset 0 0 0 1px var(--hx-line-1)}
.hx-peek__cv canvas{width:100%;height:100%}
.hx-peek__cnt{position:absolute;right:var(--hx-s-4);bottom:var(--hx-s-3);font:400 var(--hx-fs-10)/1 var(--hx-font-mono);color:var(--hx-text-3)}
.hx-peek__subs{display:flex;flex-wrap:wrap;align-items:center;gap:var(--hx-s-3);padding:var(--hx-s-4) var(--hx-s-5) 0}
.hx-peek__subs .hx-chip svg{color:var(--hx-text-2)}
.hx-peek__subs .hx-chip em{font:normal var(--hx-fs-10)/1 var(--hx-font-mono);color:var(--hx-text-3);margin-left:2px}
.hx-peek__lbl{font-size:var(--hx-fs-11);color:var(--hx-text-3)}
.hx-peek__f{display:flex;align-items:center;gap:var(--hx-s-3);padding:var(--hx-s-4) var(--hx-s-4) var(--hx-s-4) var(--hx-s-5);font-size:var(--hx-fs-11);color:var(--hx-text-3)}

</style>
</head>
<body>
<div class="hx-app hx-l4" id="app">

  <!-- ① 顶部条：全宽 -->
  <header class="hx-top hx-l4top" id="top">
    <button class="hx-iconbtn" id="lsToggle" data-tip="收起 / 展开左侧栏 · [" data-ic="panelL"></button>
    <span class="hx-l4logo">H</span>
    <span class="hx-l4title" id="sessTitle">竞品定价调研</span>
    <span class="hx-top__div"></span>
    <nav class="hx-crumb" id="crumb"></nav>
    <span class="hx-branch"><span data-ic="branch"></span>main</span>
    <span class="sp"></span>
    <span class="hx-modelpill" id="modelPill"><i></i><span id="modelPillTxt">模型正在编辑…</span></span>
    <button class="hx-level" id="levelBtn" data-tip="模型授权档位"><span class="hx-level__ticks" id="levelTicks"><i></i><i></i><i></i><i></i><i></i></span><span id="levelTxt"></span></button>
    <span class="hx-top__div"></span>
    <span class="hx-runstat" id="runStat"><i></i><span id="runTxt">待运行</span></span>
    <button class="hx-btn is-primary is-sm" id="runBtn"><span data-ic="play"></span><span id="runBtnTxt">运行</span><kbd>⌘↵</kbd></button>
    <button class="hx-btn is-danger is-sm" id="stopBtn" data-tip="急停 · 立即停止并降到 0 档 · ⌘."><span data-ic="stop"></span>急停</button>
    <span class="hx-top__div"></span>
    <button class="hx-iconbtn" id="fullBtn" data-tip="专注画布（收起两侧栏）· F" data-ic="expand"></button>
    <button class="hx-iconbtn" id="themeBtn" data-tip="切换浅色 / 深色" data-ic="moon"></button>
    <button class="hx-iconbtn" id="rsToggle" data-tip="展开右侧栏 · ]" data-ic="panelR"></button>
  </header>

  <div class="hx-shell" id="shell">

    <!-- ② 左侧栏：会话 + 节点库（默认展开，可收成 56 宽图标栏） -->
    <aside class="hx-ls" id="ls">
      <div class="hx-ls__rail">
        <button class="hx-iconbtn" data-lsgo="new" data-tip="新建会话" data-ic="plus"></button>
        <button class="hx-iconbtn" data-lsgo="sess" data-tip="会话" data-ic="chat"></button>
        <button class="hx-iconbtn" data-lsgo="lib" data-tip="节点库 · /" data-ic="lib"></button>
        <span class="sp"></span>
        <button class="hx-iconbtn" data-lsgo="set" data-tip="设置" data-ic="gear"></button>
      </div>
      <div class="hx-ls__full">
        <div class="hx-ls__new">
          <button class="hx-btn is-sm hx-ls__newbtn" data-lsgo="new"><span data-ic="plus"></span>新建会话</button>
        </div>

        <section class="hx-ls__sec" id="secSess">
          <button class="hx-ls__sech" data-fold="secSess"><span>会话</span><span data-ic="chevd"></span></button>
          <div class="hx-sess" id="sessList"></div>
        </section>

        <section class="hx-ls__sec" id="secTree">
          <button class="hx-ls__sech" data-fold="secTree"><span>结构</span><span data-ic="chevd"></span></button>
          <div class="hx-tree" id="nestTree"></div>
        </section>

        <section class="hx-ls__sec is-grow" id="secLib">
          <button class="hx-ls__sech" data-fold="secLib"><span>节点库</span><span data-ic="chevd"></span></button>
          <aside class="hx-lib" id="lib">
            <button class="hx-iconbtn is-sm" id="libClose" hidden></button>
            <div class="hx-lib__search"><span data-ic="search"></span><input class="hx-input is-sm" id="libSearch" placeholder="搜索节点"><kbd>/</kbd></div>
            <div class="hx-lib__list" id="libList"></div>
            <div class="hx-lib__tabs"><div class="hx-seg is-fill" id="libTabs"><button class="is-on" data-v="atom">原子节点</button><button data-v="sub">子图库</button><button data-v="ext">扩展包</button><i class="hx-seg__thumb"></i></div></div>
          </aside>
        </section>

        <div class="hx-ls__foot">
          <button class="hx-ls__me" data-lsgo="set"><span class="hx-ls__av">K</span><span>本机 · 单用户</span><span class="sp"></span><span data-ic="gear"></span></button>
        </div>
      </div>
    </aside>

    <!-- ③ 中间：画布满铺；对话输入框浮在画布底部居中 -->
    <main class="hx-main" id="main">
      <section class="hx-stage" id="stage">
        <div class="hx-body">
          <div class="hx-viewport" id="vp" tabindex="0">
            <div class="hx-layer" id="layer">
              <div class="hx-world" id="world">
                <svg class="hx-edges" id="edges"><g id="edgeG"></g><path class="hx-edge-tmp" id="tmpEdge" d=""/></svg>
                <div class="hx-nodes" id="nodes"></div>
                <div class="hx-etools" id="etools"><button data-et="insert" data-tip="在此插入节点" data-ic="plus"></button><button class="is-danger" data-et="del" data-tip="删除连线" data-ic="x"></button></div>
              </div>
            </div>
            <div class="hx-marquee" id="marquee" hidden></div>
            <div class="hx-linkwhy" id="linkWhy" hidden></div>
            <div class="hx-cursor is-off" id="cursor"><svg viewBox="0 0 16 16"><path d="M2 1.5 13.5 7 8.2 8.4 6 13.8Z" fill="currentColor" stroke="var(--hx-bg-2)" stroke-width="1.2" stroke-linejoin="round"/></svg><span>AI</span></div>

            <button class="hx-iconbtn hx-libfab hx-panel" id="libOpen" hidden></button>

            <!-- 工具停靠栏：画布顶部居中（底部让给对话框） -->
            <div class="hx-dock" id="dock"></div>

            <!-- 嵌套系统：父图位置卡（左上，进入子系统后出现）、预览浮层（节点旁） -->
            <div class="hx-panel hx-nest" id="nestCard" hidden></div>
            <div class="hx-panel hx-peek" id="peek" hidden></div>

            <!-- 小地图：左下 -->
            <div class="hx-panel hx-mini" id="mini">
              <div class="hx-mini__cv" id="miniCv"><canvas id="miniCanvas"></canvas><div class="hx-mini__view" id="miniView"></div></div>
              <div class="hx-mini__bar">
                <button class="hx-iconbtn is-sm" id="zoomOut" data-tip="缩小" data-ic="minus"></button>
                <span id="zoomTxt">100%</span>
                <button class="hx-iconbtn is-sm" id="zoomIn" data-tip="放大" data-ic="plus"></button>
                <button class="hx-iconbtn is-sm" id="fitBtn" data-tip="适应视图 · 1" data-ic="fit"></button>
              </div>
            </div>

            <div class="hx-proposal" id="proposal" hidden></div>
            <div class="hx-fps" id="fps" hidden></div>
            <div class="hx-banner" id="banner" hidden></div>
            <span id="cardStatus" hidden></span><!-- 28_run.js 会写这个徽标；v0.4 没有对话卡片，保留一个隐藏占位 -->

            <!-- 浮动回复：最近几条对话浮在输入框上方，完整记录在右侧栏「对话」 -->
            <div class="hx-panel hx-float" id="float">
              <div class="hx-float__bar"><span>最近对话</span><span class="sp"></span><button class="hx-float__all" id="floatAll">查看全部<span data-ic="chevr"></span></button><button class="hx-iconbtn is-sm" id="floatHide" data-tip="收起" data-ic="x"></button></div>
              <div class="hx-float__list" id="floatList"></div>

    '汇合': { cat: '拓扑', sm: 1, desc: '多路收成一份', in: [['in', 'any', 1]], out: [['collected', 'list']],
      params: { wait: P('等待', 'sel', 'all', { opts: ['all', 'k_of_n', 'first', 'timeout'], inline: 1 }), timeout: P('超时 s', 'num', 300, { min: 10, max: 3600 }) } },
    '聚合': { cat: '聚合', desc: '列表 → 结构化结果（纯规则）', in: [['items', 'list']], out: [['result', 'gen']],
      params: { op: P('算子', 'sel', 'group_ratio', { opts: ['group_ratio', 'vote', 'dedupe', 'sort', 'top_k', 'divergence'], inline: 1 }), key: P('按字段', 'text', 'cluster', { inline: 1 }),
        deterministic: P('确定性', 'bool', true, { lock: 'kernel' }) } },
    '分支': { cat: '控制', sm: 1, desc: '按表达式分流', in: [['value', 'gen']], out: [['yes', 'ctrl'], ['no', 'ctrl']],
      params: { when: P('条件', 'text', 'achieved == true', { inline: 1 }), pure: P('无副作用', 'bool', true, { lock: 'kernel' }) } },
    '循环': { cat: '控制', sub: 1, desc: '唯一能形成环的节点', in: [['init', 'gen']], out: [['final', 'gen']],
      params: { max_rounds: P('最大轮数', 'num', 5, { min: 1, max: 50, inline: 1 }), trigger: P('触发', 'seg', 'rounds', { opts: ['rounds', 'event'], inline: 1 }), stall: P('无进展停止', 'num', 2, { min: 1, max: 10 }) } },
    '人工': { cat: '人工', sm: 1, desc: '审批、输入、选择', in: [['request', 'any']], out: [['approved', 'ctrl'], ['rejected', 'ctrl']],
      params: { mode: P('方式', 'sel', 'approve', { opts: ['approve', 'input', 'choose'], inline: 1 }), timeout: P('超时', 'text', '24h') } },
    '子图端口': { cat: '边界 · 组合', sm: 1, desc: '子图的入口 / 出口 / 摘要', in: [['in', 'any']], out: [['out', 'any']],
      params: { role: P('角色', 'sel', 'entry', { opts: ['entry', 'exit', 'summary', 'escalation'], inline: 1 }) } },
    '子图引用': { cat: '边界 · 组合', sub: 1, desc: '把封装好的子图当节点用', in: [['in', 'any']], out: [['out', 'any']],
      params: { ref: P('引用', 'text', '新子图@v0.1', { inline: 1 }), pin: P('版本', 'seg', 'snapshot', { opts: ['snapshot', 'link'] }) } }
  };
  HX.TYPES = Object.keys(HX.DEF);

  /** 示例图：闭环迭代（外层主脑 + 循环子图）。坐标交给自动布局 */
  HX.buildTemplate = function () {

    const models = mk('资源', '模型列表[]', { kind: '列表', value: '3 家厂商大模型' });
    const big = mk('资源', '大模型', { kind: '模型', value: 'large-model' });
    const fan = mk('扇出', '智囊团', { n: 3, concurrency: 3 });
    const c1 = mk('上下文装配', '聚类员配方', { recipe: '聚类员配方@1', budget: 0.08 });
    const clu = mk('Agent', '聚类员', { output_schema: '簇标注@1' });
    const agg = mk('聚合', '按比例分级', { op: 'group_ratio', key: 'cluster' });
    const c2 = mk('上下文装配', '决策者配方', { recipe: '决策者配方@1' });
    const dec = mk('Agent', '决策者', { output_schema: '任务卡@1[]' });
    const tool = mk('工具', '检索', { tool: '检索', risk: 'L0' });
    const pool = mk('扇出', '执行池', { n: 4, concurrency: 3, collect: 'all' });
    const c3 = mk('上下文装配', '验收者配方', { recipe: '验收者配方@1', budget: 0.12 });
    const jud = mk('Agent', '验收者', { output_schema: '判定@1', temperature: 0.2 });
    const br = mk('分支', '达成？', { when: 'achieved == true' });
    const ox = mk('子图端口', '出口', { role: 'exit' });
    const inner = HX.newGraph([ie, models, big, fan, c1, clu, agg, c2, dec, tool, pool, c3, jud, br, ox], [

    const l1 = mk('账本', '目标账本', { op: 'read', path: '目标树' });
    const bm = mk('资源', '大模型', { kind: '模型', value: 'large-model' });
    const c0 = mk('上下文装配', '主脑配方', { recipe: '主脑配方@1', budget: 0.05 });

    const loop = mk('循环', '闭环迭代', { max_rounds: 5 }, inner);
    const sum = mk('子图端口', '摘要端口', { role: 'summary' });

/* ---- 设计规范_v0.3/src/22_state.js ---- */

/* ===== 22_state.js · 全局状态、Op 工厂、dispatch / undo / redo =====
   规则：任何对图的修改都必须封装成 op 并经过 HX.dispatch(op)。
   op = { kind, label, actor:'user'|'model'|'system', reason?, g, apply(), revert() }
   ======================================================================== */
(function (HX) {
  'use strict';
  let seq = 0;
  HX.uid = p => (p || 'n') + (++seq).toString(36);

  /* ---------- 事件总线 ---------- */
  const bus = {};
  HX.on = (ev, fn) => { (bus[ev] = bus[ev] || []).push(fn); };
  HX.emit = (ev, d) => { (bus[ev] || []).forEach(fn => { try { fn(d); } catch (e) { console.error(e); } }); };

  /* ---------- 图数据 ---------- */
  HX.newGraph = function (nodes, edges) {
    const g = { nodes: new Map(), edges: new Map() };
    (nodes || []).forEach(n => g.nodes.set(n.id, n));
    (edges || []).forEach(e => g.edges.set(e.id, e));
    return g;
  };
  HX.mk = function (type, label, params, children) {
    const d = HX.DEF[type], p = {};
    Object.keys(d.params).forEach(k => { p[k] = d.params[k].def; });
    Object.assign(p, params || {});
    const n = { id: HX.uid('n'), type: type, label: label || type, x: 0, y: 0, params: p, promoted: [], rev: 1,
      status: 'idle', prog: 0, sub: '', meta: '', ai: null, ghost: false, pending: {} };
    if (d.sub) {
      if (!children) {
        const a = HX.mk('子图端口', '入口', { role: 'entry' }), b = HX.mk('子图端口', '出口', { role: 'exit' });
        b.x = 320; children = HX.newGraph([a, b], []);
      }
      n.children = children;
    }
    return n;
  };
  HX.edge = (a, ap, b, bp) => ({ id: HX.uid('e'), f: a.id || a, fp: ap, t: b.id || b, tp: bp });
  HX.touch = n => { if (n) n.rev = (n.rev || 0) + 1; };

  /* ---------- 全局状态 ---------- */
  HX.S = {
    root: null,
    stack: [],                 // [{label, g, node}] 面包屑
    view: { x: 0, y: 0, k: 1 },
    sel: new Set(), selEdge: null, hoverEdge: null,
    tool: 'select',            // select | hand
    level: 2,                  // 授权档位 0–4
    past: [], future: [],
    open: false, full: false, focus: false
  };
  HX.cur = () => HX.S.stack[HX.S.stack.length - 1].g;
  HX.setRoot = function (g, label) {
    HX.S.root = g; HX.S.stack = [{ label: label || '根图', g: g, node: null }];
    HX.S.sel.clear(); HX.S.selEdge = null;
  };

  /* ---------- dispatch / undo / redo ---------- */
  HX.dispatch = function (op) {
    op.actor = op.actor || 'user';
    op.at = Date.now();
    op.apply();
    HX.S.past.push(op);
    if (HX.S.past.length > 300) HX.S.past.shift();
    HX.S.future.length = 0;
    HX.emit('op', op);
    return op;
  };
  HX.undo = function () {
    const op = HX.S.past.pop(); if (!op) return null;
    op.revert(); op.undone = true; HX.S.future.push(op); HX.emit('op', op); return op;
  };
  HX.redo = function () {
    const op = HX.S.future.pop(); if (!op) return null;
    op.apply(); op.undone = false; HX.S.past.push(op); HX.emit('op', op); return op;
  };
  /** 撤销到某条 op 之前（操作历史里的「回到此处」） */
  HX.undoTo = function (op) {
    if (HX.S.past.indexOf(op) < 0) return;
    while (HX.S.past.length && HX.S.past[HX.S.past.length - 1] !== op) HX.undo();
    HX.undo();
  };

  /* ---------- Op 工厂 ---------- */
  const base = (g, kind, label, apply, revert) => ({ g: g, kind: kind, label: label, apply: apply, revert: revert });

  HX.opAdd = function (g, nodes, edges, label, removeEdges) {
    nodes = nodes || []; edges = edges || []; removeEdges = removeEdges || [];
    return base(g, 'add', label || ('添加 ' + nodes.map(n => n.label).join('、')),
      () => { nodes.forEach(n => g.nodes.set(n.id, n)); removeEdges.forEach(e => g.edges.delete(e.id)); edges.forEach(e => g.edges.set(e.id, e)); },
      () => { edges.forEach(e => g.edges.delete(e.id)); removeEdges.forEach(e => g.edges.set(e.id, e)); nodes.forEach(n => g.nodes.delete(n.id)); });
  };
  HX.opRemove = function (g, nodeIds, edgeIds) {
    const ns = (nodeIds || []).map(id => g.nodes.get(id)).filter(Boolean);
    const set = new Set(ns.map(n => n.id));
    const es = [...g.edges.values()].filter(e => set.has(e.f) || set.has(e.t) || (edgeIds || []).indexOf(e.id) >= 0);
    return base(g, 'remove', ns.length ? ('删除 ' + ns.map(n => n.label).join('、')) : '删除连线',
      () => { es.forEach(e => g.edges.delete(e.id)); ns.forEach(n => g.nodes.delete(n.id)); },
      () => { ns.forEach(n => g.nodes.set(n.id, n)); es.forEach(e => g.edges.set(e.id, e)); });
  };
  HX.opConnect = function (g, e) {
    const tn = g.nodes.get(e.t), pd = HX.ports(tn).in.find(p => p[0] === e.tp);
    const replaced = pd && pd[2] ? [] : [...g.edges.values()].filter(x => x.t === e.t && x.tp === e.tp);
    const fn = g.nodes.get(e.f);
    const op = base(g, 'connect', '连线 ' + fn.label + '.' + e.fp + ' → ' + tn.label + '.' + e.tp,
      () => { replaced.forEach(x => g.edges.delete(x.id)); g.edges.set(e.id, e); },
      () => { g.edges.delete(e.id); replaced.forEach(x => g.edges.set(x.id, x)); });
    op.replaced = replaced;
    return op;
  };
  HX.opParam = function (g, n, k, v, from) {
    const old = from !== undefined ? from : n.params[k];
    return base(g, 'param', n.label + '.' + k + '：' + old + ' → ' + v,
      () => { n.params[k] = v; HX.touch(n); },
      () => { n.params[k] = old; HX.touch(n); });
  };
  HX.opLabel = function (g, n, label) {
    const old = n.label;
    return base(g, 'label', '重命名 ' + old + ' → ' + label, () => { n.label = label; HX.touch(n); }, () => { n.label = old; HX.touch(n); });
  };
  HX.opMove = function (g, moves, label) {
    return base(g, 'move', label || ('移动 ' + moves.length + ' 个节点'),
      () => moves.forEach(m => { const n = g.nodes.get(m.id); if (n) { n.x = m.to.x; n.y = m.to.y; } }),
      () => moves.forEach(m => { const n = g.nodes.get(m.id); if (n) { n.x = m.from.x; n.y = m.from.y; } }));
  };
  HX.opPromote = function (g, n, k) {
    const on = n.promoted.indexOf(k) < 0;
    const cut = on ? [] : [...g.edges.values()].filter(e => e.t === n.id && e.tp === k);
    return base(g, 'promote', (on ? '参数转端口 ' : '撤回端口 ') + n.label + '.' + k,
      () => { if (on) n.promoted.push(k); else { n.promoted = n.promoted.filter(x => x !== k); cut.forEach(e => g.edges.delete(e.id)); } HX.touch(n); },
      () => { if (on) n.promoted = n.promoted.filter(x => x !== k); else { n.promoted.push(k); cut.forEach(e => g.edges.set(e.id, e)); } HX.touch(n); });
  };
  /** 结构快照 op：fn(g) 任意增删节点/连线，apply/revert 在前后两份 Map 之间切换 */
  HX.opStruct = function (g, kind, label, fn) {
    const bn = new Map(g.nodes), be = new Map(g.edges);
    fn(g);
    const an = new Map(g.nodes), ae = new Map(g.edges);
    g.nodes = bn; g.edges = be;
    return base(g, kind, label, () => { g.nodes = new Map(an); g.edges = new Map(ae); }, () => { g.nodes = new Map(bn); g.edges = new Map(be); });
  };
  HX.opBatch = function (g, label, ops) {
    return base(g, 'batch', label, () => ops.forEach(o => o.apply()), () => ops.slice().reverse().forEach(o => o.revert()));
  };
  /** 遍历所有图（含子图），用于按名称查找节点 */
  HX.walk = function (g, fn, path) {
    path = path || [];
    g.nodes.forEach(n => { fn(n, g, path); if (n.children) HX.walk(n.children, fn, path.concat([n])); });
  };
})(window.HX);

/* ---- 设计规范_v0.3/src/23_geom.js ---- */

/* ===== 23_geom.js · 几何与图算法（纯函数，不读 DOM — 性能规则 R2） ===== */
(function (HX) {
  'use strict';
  /* 布局常数：必须与 tokens.css 的 --hx-node-* 一致 */
  const L = HX.L = { W: 236, WS: 184, HEAD: 38, PAD: 6, ROW: 24, WROW: 28, WPAD: 12, THUMB: 72, FOOT: 26, GRID: 20, GAPX: 72, GAPY: 36, BAND: 96 };

  HX.nodeW = n => (HX.DEF[n.type].sm ? L.WS : L.W);
  /** 端口表：定义的端口 + 由参数转成的端口（类型为 any） */
  HX.ports = function (n) {
    const d = HX.DEF[n.type];
    return { in: d.in.concat(n.promoted.map(k => [k, 'any', 0, 1])), out: d.out };
  };
  HX.inlineKeys = n => Object.keys(HX.DEF[n.type].params).filter(k => HX.DEF[n.type].params[k].inline && n.promoted.indexOf(k) < 0).slice(0, 3);
  HX.nodeH = function (n) {
    const P = HX.ports(n), rows = Math.max(P.in.length, P.out.length, 1), w = HX.inlineKeys(n).length;
    return L.HEAD + L.PAD * 2 + rows * L.ROW + (w ? 1 + w * L.WROW + L.WPAD : 0) + (n.children ? L.THUMB : 0) + (n.foot ? L.FOOT : 0);
  };
  /** 端口圆心（世界坐标） */
  HX.portPos = function (n, name, dir) {
    const list = HX.ports(n)[dir];
    let i = list.findIndex(p => p[0] === name); if (i < 0) i = 0;
    return [dir === 'in' ? n.x : n.x + HX.nodeW(n), n.y + L.HEAD + L.PAD + i * L.ROW + L.ROW / 2];
  };
  HX.portType = function (n, name, dir) {
    const p = HX.ports(n)[dir].find(q => q[0] === name);
    return p ? p[1] : 'any';
  };

  /** 三次贝塞尔：两端切线水平；回连时固定偏移 120（DESIGN.md §6.1） */
  HX.bez = function (a, b) {
    const dx = b[0] - a[0];
    const off = dx < 0 ? 120 : Math.max(48, Math.min(180, Math.abs(dx) * 0.5));
    const c1 = [a[0] + off, a[1]], c2 = [b[0] - off, b[1]];
    const mx = (a[0] + 3 * c1[0] + 3 * c2[0] + b[0]) / 8, my = (a[1] + 3 * c1[1] + 3 * c2[1] + b[1]) / 8;
    return { d: 'M' + a[0].toFixed(1) + ',' + a[1].toFixed(1) + ' C' + c1[0].toFixed(1) + ',' + c1[1].toFixed(1) + ' ' + c2[0].toFixed(1) + ',' + c2[1].toFixed(1) + ' ' + b[0].toFixed(1) + ',' + b[1].toFixed(1), mx: mx, my: my };
  };
  HX.edgeGeom = function (g, e) {
    const a = g.nodes.get(e.f), b = g.nodes.get(e.t);
    if (!a || !b) return null;
    return HX.bez(HX.portPos(a, e.fp, 'out'), HX.portPos(b, e.tp, 'in'));
  };
  HX.snap = (v, on) => (on === false ? v : Math.round(v / L.GRID) * L.GRID);

  /** from 能否沿连线到达 to */
  HX.reach = function (g, from, to) {
    const out = new Map(); g.edges.forEach(e => { if (!out.has(e.f)) out.set(e.f, []); out.get(e.f).push(e.t); });
    const st = [from], seen = new Set();
    while (st.length) { const x = st.pop(); if (x === to) return true; if (seen.has(x)) continue; seen.add(x); (out.get(x) || []).forEach(y => st.push(y)); }
    return false;
  };
  /** 新连线 f→t 是否会形成环（只有循环节点能形成环） */
  HX.wouldCycle = (g, f, t) => f === t || HX.reach(g, t, f);

  /** 拓扑分层（Kahn），返回 [[id…], …]；有环时剩余节点放最后一层 */
  HX.topoLevels = function (g) {
    const indeg = new Map(), out = new Map();
    g.nodes.forEach((n, id) => { indeg.set(id, 0); out.set(id, []); });
    g.edges.forEach(e => { if (indeg.has(e.t) && out.has(e.f)) { indeg.set(e.t, indeg.get(e.t) + 1); out.get(e.f).push(e.t); } });
    const levels = []; let cur = [...indeg.keys()].filter(id => indeg.get(id) === 0); const seen = new Set();
    while (cur.length) {
      levels.push(cur); cur.forEach(id => seen.add(id));
      const nx = [];
      cur.forEach(id => out.get(id).forEach(t => { indeg.set(t, indeg.get(t) - 1); if (indeg.get(t) === 0) nx.push(t); }));
      cur = [...new Set(nx)];
    }
    const rest = [...indeg.keys()].filter(id => !seen.has(id));
    if (rest.length) levels.push(rest);
    return levels;
  };

  /** 分层自动布局。cols：每行最多几层，超出换到下一行（band） */
  HX.layout = function (g, opt) {
    opt = opt || {}; const cols = opt.cols || 99;
    const ids = [...g.nodes.keys()], layer = new Map(), succ = new Map(), pred = new Map();
    ids.forEach(id => { succ.set(id, []); pred.set(id, []); });
    g.edges.forEach(e => { if (succ.has(e.f) && pred.has(e.t)) { succ.get(e.f).push(e.t); pred.get(e.t).push(e.f); } });
    HX.topoLevels(g).forEach(lv => lv.forEach(id => {
      const ps = pred.get(id); layer.set(id, ps.length ? Math.max.apply(null, ps.map(p => (layer.has(p) ? layer.get(p) : 0) + 1)) : 0);
    }));
    ids.forEach(id => { if (!pred.get(id).length && succ.get(id).length) layer.set(id, Math.max(0, Math.min.apply(null, succ.get(id).map(t => layer.get(t))) - 1)); });
    const byL = new Map(); ids.forEach(id => { const l = layer.get(id); if (!byL.has(l)) byL.set(l, []); byL.get(l).push(id); });
    const maxL = Math.max.apply(null, [0].concat([...byL.keys()]));
    const order = new Map(); const pos = new Map();
    const colW = L.W + L.GAPX;
    let bandY = 0, bandH = 0, band = -1;
    for (let l = 0; l <= maxL; l++) {
      const b = Math.floor(l / cols);
      if (b !== band) { bandY += band < 0 ? 0 : bandH + L.BAND; bandH = 0; band = b; }
      const list = (byL.get(l) || []).slice();
      list.forEach(id => { const ps = pred.get(id).filter(p => order.has(p)); order.set(id, ps.length ? ps.reduce((s, p) => s + order.get(p), 0) / ps.length : 0); });
      list.sort((a, b2) => order.get(a) - order.get(b2));
      let y = bandY;
      list.forEach((id, i) => {
        const n = g.nodes.get(id);
        order.set(id, i);
        pos.set(id, { x: (l % cols) * colW, y: y });
        y += HX.nodeH(n) + L.GAPY;
      });
      bandH = Math.max(bandH, y - bandY - L.GAPY);
    }

/* ---- 设计规范_v0.3/src/28_run.js ---- */

/* ===== 28_run.js · 运行模拟：拓扑执行、循环轮次、人工审批挂起、急停 ===== */
(function (HX) {
  'use strict';
  const $ = HX.$, S = HX.S;

  function reset(g) { g.nodes.forEach(n => { n.status = 'idle'; n.prog = 0; n.sub = ''; n.meta = ''; n.activeOut = null; n.round = 0; if (n.children) reset(n.children); }); g.edges.forEach(e => { e.flow = false; }); }

  function setUI(state) {
    const st = $('runStat'); st.className = 'hx-runstat is-' + state;
    $('runTxt').textContent = { idle: '待运行', running: '运行中', waiting: '等待审批', done: '已完成', failed: '已停止' }[state];
    $('runBtn').disabled = state === 'running' || state === 'waiting';
    $('runBtnTxt').textContent = state === 'running' || state === 'waiting' ? '运行中' : '运行';
    const cs = $('cardStatus'); cs.className = 'hx-badge' + ({ running: ' is-run', waiting: ' is-wait', done: ' is-ok', failed: ' is-bad' }[state] || ''); cs.textContent = $('runTxt').textContent;
  }

  run.start = async function () {
    if (run.R && !run.R.end) return;
    if (!S.open) HX.open();
    $('top').classList.remove('is-danger'); $('banner').hidden = true;
    reset(S.root); HX.sync();
    const R = run.R = { t0: performance.now(), tokens: 0, count: 0, spans: [], path: '', stop: false, end: 0, timers: [], pending: new Map() };
    $('paneLog').innerHTML = '';
    setUI('running');
    const tick = setInterval(() => { HX.metrics(); HX.renderTimeline(); if (!S.open) HX.drawCard(); else HX.drawMini(); }, 200);
    HX.log('根图', '开始运行 · 授权档位 ' + S.level, 'o');
    let ok = true;
    try { await runGraph(S.root, '根图', 0, {}); }
    catch (err) { ok = false; }
    clearInterval(tick); R.end = performance.now();
    HX.metrics(); HX.renderTimeline(); HX.drawCard(); HX.drawMini();
    setUI(ok ? 'done' : 'failed');
    if (ok) { HX.log('根图', '运行完成 · ' + ((R.end - R.t0) / 1000).toFixed(1) + 's · ' + (R.tokens / 1000).toFixed(1) + 'k tokens', 'o'); HX.chat.ai('运行完成：用时 <span class="k">' + ((R.end - R.t0) / 1000).toFixed(1) + 's</span>，约 <span class="k">' + (R.tokens / 1000).toFixed(1) + 'k tokens</span>，节点共执行 ' + R.count + ' 次。闭环迭代在第 2 轮通过验收。'); HX.toast('运行完成', '闭环迭代第 2 轮通过验收', { tone: 'ok' }); }
  };

  async function runGraph(g, path, depth, ctx) {
    g.nodes.forEach(n => { n.status = 'queued'; n.prog = 0; n.sub = '排队中'; n.activeOut = null; paint(n, g); });
    const levels = HX.topoLevels(g);

  }

  async function runNode(n, g, path, depth, ctx) {
    const R = run.R; if (R.stop) throw new Error('stop');

        case '上下文装配': await step(3, 120, () => { n.sub = '装配 ' + (2 + Math.random() * 3).toFixed(1) + 'k tokens'; }); break;

          while (done < N) { const batch = Math.min(C, N - done); await step(4, 120, i => { n.sub = Math.min(N, done + Math.ceil(batch * i / 4)) + ' / ' + N + ' · 并发 ' + C; n.prog = (done + batch * i / 4) / N * 100; R.tokens += 220 * batch; }); done += batch; }

        }

          n.sub = ok ? '是 → yes' : '否 → no'; HX.log(p, ok ? '判定：达成' : '判定：未达成，缺 B 公司数据', ok ? 'o' : 'w'); break;
        }
        case '人工': {
          n.status = 'waiting'; n.sub = '等待审批 · 0:00'; span.st = 'waiting'; paint(n, g); setUI('waiting');
          HX.log(p, '挂起，等待人工审批', 'w');
          const msg = HX.chat.ai('「' + HX.esc(n.label) + '」需要你审批后才能继续。<div class="hx-msg__acts"><button class="hx-btn is-sm is-ok" data-run-approve="' + n.id + '">批准</button><button class="hx-btn is-sm is-ghost" data-run-deny="' + n.id + '">驳回</button></div>');
          const tw = setInterval(() => { const s = Math.round((performance.now() - t0) / 1000); n.sub = '等待审批 · ' + Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); paint(n, g); }, 1000);
          const okv = await new Promise(res => R.pending.set(n.id, res));
          clearInterval(tw); msg.querySelectorAll('button').forEach(b => { b.disabled = true; });
          if (R.stop) throw new Error('stop');
          n.status = 'running'; n.activeOut = okv ? 'approved' : 'rejected'; n.sub = okv ? '已批准' : '已驳回'; span.st = 'running'; setUI('running');

            const c2 = { round: r }; n.round = r; n.prog = (r - 0.5) / max * 100; n.sub = n.type === '循环' ? '第 ' + r + ' 轮进行中' : '运行子图';
            if (HX.cur() === g && HX.nodeEl(n.id)) { HX.touch(n); HX.renderNode(n); }
            if (n.type === '循环') HX.log(p, '第 ' + r + ' 轮开始');
            await runGraph(n.children, p + (n.type === '循环' ? '#r' + r : ''), depth + 1, c2);
            ok = c2.achieved !== false;
            if (ok || n.type !== '循环') break;
            HX.chat.ai('「' + HX.esc(n.label) + '」第 ' + r + ' 轮未通过验收。验收者写了差距报告：<span class="k">缺 B 公司企业版报价，官网与新闻稿均已查过</span>。带着差距报告进入第 ' + (r + 1) + ' 轮。');
          }
          n.prog = 100; n.sub = n.type === '循环' ? (ok ? '第 ' + r + ' 轮达成' : '达到最大轮数') : '完成';
          if (n.type === '循环') HX.log(p, ok ? '第 ' + r + ' 轮通过验收' : '达到最大轮数', ok ? 'o' : 'w');
          break;
        }
        default: await step(2, 140 + Math.random() * 120, () => { R.tokens += 40; });
      }
    } finally { inc.forEach(e => { e.flow = false; paintEdge(e, g); }); }
    if (R.stop) throw new Error('stop');
    n.status = 'done'; n.prog = 100; if (n.type !== '分支' && n.type !== '人工' && !n.children) n.sub = '';
    const dt = (performance.now() - t0) / 1000; n.meta = dt.toFixed(1) + 's';

/* ---- 设计规范_v0.3/src/29_model.js ---- */

/* ===== 29_model.js · 模型操作者：对话指令 → 提议（幽灵节点）或直接修改 ===== */
(function (HX) {
  'use strict';
  const $ = HX.$, S = HX.S, esc = s => HX.esc(s);
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const now = () => new Date().toTimeString().slice(0, 5);

  /* ---------------- 对话 ---------------- */
  const chat = HX.chat = {};
  chat.add = function (role, html, opt) {
    const m = document.createElement('div'); m.className = 'hx-msg is-' + role + ' is-enter';
    m.innerHTML = (role === 'user' ? '' : '<div class="hx-msg__av">AI</div>') + '<div class="hx-msg__body">' + html + '</div>';
    $('chat').appendChild(m); $('chat').scrollTop = 1e9; return m;
  };
  chat.user = t => chat.add('user', esc(t));
  chat.ai = (h, opt) => chat.add('model', '<p>' + h + '</p>', opt);

  /* ---------------- 提议（proposal）：一组节点 / 连线 / 参数改动 ---------------- */
  const model = HX.model = { props: [] };
  function find(label, type) { let r = null; HX.walk(S.root, (n, g, path) => { if (!r && n.label === label && (!type || n.type === type)) r = { n: n, g: g, path: path }; }); return r; }
  function ghostOn(p) {
    p.nodes.forEach(n => { n.ghost = true; n.ghostReason = p.reason; n.ai = { reason: p.reason, level: S.level, time: now() }; HX.touch(n); p.g.nodes.set(n.id, n); });
    p.edges.forEach(e => { e.ghost = true; p.g.edges.set(e.id, e); });
    p.removes.forEach(e => { e.removing = true; });
    p.params.forEach(x => { x.n.pending[x.k] = x.v; x.n.ai = { reason: p.reason, level: S.level, time: now() }; HX.touch(x.n); });
  }
  function ghostOff(p) {
    p.nodes.forEach(n => { n.ghost = false; p.g.nodes.delete(n.id); });
    p.edges.forEach(e => { e.ghost = false; p.g.edges.delete(e.id); });
    p.removes.forEach(e => { e.removing = false; });
    p.params.forEach(x => { delete x.n.pending[x.k]; x.n.ai = null; HX.touch(x.n); });
  }
  function commit(p) {
    const ops = [];
    if (p.nodes.length || p.edges.length || p.removes.length) ops.push(HX.opAdd(p.g, p.nodes, p.edges, p.label, p.removes));
    p.params.forEach(x => ops.push(HX.opParam(p.g, x.n, x.k, x.v)));
    const op = ops.length === 1 ? ops[0] : HX.opBatch(p.g, p.label, ops);
    op.label = p.label; op.actor = 'model'; op.reason = p.reason;
    HX.dispatch(op);
    p.nodes.concat(p.params.map(x => x.n)).forEach(n => { n.ai = { reason: p.reason, level: S.level, time: now() }; HX.touch(n); });
    HX.sync();
    p.nodes.concat(p.params.map(x => x.n)).forEach(n => HX.flash(n.id));
  }
  model.decide = function (nodeId, accept) {
    const p = model.props.find(q => q.nodes.some(n => n.id === nodeId) || q.params.some(x => x.n.id === nodeId)); if (!p) return;
    settle(p, accept);
  };
  function settle(p, accept) {
    model.props = model.props.filter(q => q !== p);
    ghostOff(p);
    if (accept) commit(p); else HX.sync();
    HX.log('模型', (accept ? '采纳：' : '拒绝：') + p.label, accept ? 'm' : 'w');
    renderBar();
  }
  function renderBar() {
    const bar = $('proposal');
    if (!model.props.length) { bar.hidden = true; $('pop').hidden = true; return; }
    bar.hidden = false;
    bar.innerHTML = '<span class="hx-proposal__dot"></span><span><b>模型提议 ' + model.props.length + ' 处修改</b> · 虚线是待采纳的改动</span>' +
      '<button class="hx-btn is-sm is-ghost" data-pp="list">逐条查看</button><button class="hx-btn is-sm is-model" data-pp="all">全部采纳</button><button class="hx-btn is-sm is-ghost" data-pp="none">全部拒绝</button>';
  }
  $('proposal').addEventListener('click', e => {
    const b = e.target.closest('[data-pp]'); if (!b) return;
    if (b.dataset.pp === 'all') model.props.slice().forEach(p => settle(p, true));
    else if (b.dataset.pp === 'none') model.props.slice().forEach(p => settle(p, false));
    else {
      const pop = $('pop'), r = b.getBoundingClientRect(); pop.className = 'hx-pop is-wide';
      pop.innerHTML = '<div class="hx-pop__h">模型提议</div>' + model.props.map((p, i) => '<div class="hx-pitem"><div><b>' + esc(p.label) + '</b><span>' + esc(p.reason) + '</span></div><button class="hx-btn is-sm is-model" data-pa="' + i + '">采纳</button><button class="hx-btn is-sm is-ghost" data-pr="' + i + '">拒绝</button></div>').join('');
      pop.hidden = false; pop.style.left = Math.max(8, r.left - 120) + 'px'; pop.style.top = Math.max(8, r.top - pop.offsetHeight - 8) + 'px';
      pop.setAttribute('data-pop', '1');
    }
  });
  $('pop').addEventListener('click', e => {
    const a = e.target.closest('[data-pa],[data-pr]'); if (!a) return;
    const p = model.props[+(a.dataset.pa || a.dataset.pr)]; if (p) settle(p, a.dataset.pa !== undefined);
    if (!model.props.length) $('pop').hidden = true; else { const ev = $('proposal').querySelector('[data-pp="list"]'); if (ev) ev.click(); }
  });

  /* ---------------- AI 光标与"模型正在编辑" ---------------- */
  function pill(on, txt) { $('modelPill').classList.toggle('is-on', on); if (txt) $('modelPillTxt').textContent = txt; }
  async function pointTo(n) {
    const c = $('cursor'), v = S.view;
    const x = (n.x + HX.nodeW(n) * 0.55) * v.k + v.x, y = (n.y + 14) * v.k + v.y;
    c.classList.remove('is-off'); c.style.transform = 'translate(' + x.toFixed(0) + 'px,' + y.toFixed(0) + 'px)';
    await sleep(680);
  }
  async function goTo(hit) {
    const want = [S.stack[0]].concat(hit.path.map(p => ({ label: p.label, g: p.children, node: p })));
    const same = want.length === S.stack.length && want.every((s, i) => s.g === S.stack[i].g);
    if (!same) { S.stack = want; HX.switchGraph('enter'); await sleep(420); }
  }

  /* ---------------- 指令 → 提议 ---------------- */
  function planApproval() {
    const j = find('验收者', 'Agent'), b = find('达成？'); if (!j || !b) return null;
    const g = j.g, e0 = [...g.edges.values()].find(e => e.f === j.n.id && e.t === b.n.id);
    const h = HX.mk('人工', '验收复核', { mode: 'approve' }); h.x = HX.snap(j.n.x + 150); h.y = HX.snap(j.n.y + HX.nodeH(j.n) + 70);
    return [{ g: g, hit: j, label: '在「验收者」后加人工审批', reason: '验收结果直接决定是否结束循环，加一道人工复核，避免错误的"达成"让流程提前结束。',
      nodes: [h], edges: [HX.edge(j.n, 'result', h, 'request'), HX.edge(h, 'approved', b.n, 'value')], removes: e0 ? [e0] : [], params: [] }];
  }
  function planConc(v) {
    const p = find('执行池', '扇出'); if (!p) return null;
    return [{ g: p.g, hit: p, label: '执行池并发 ' + p.n.params.concurrency + ' → ' + v, reason: '执行池在检索限流下排队，提高并发能缩短每轮用时。', nodes: [], edges: [], removes: [], params: [{ n: p.n, k: 'concurrency', v: v }] }];
  }
  function planOptimize() {

      else if (k === 'enter') enterPeek();
      else if (k === 'back') { peek.path.pop(); renderPeek(false); }
      else if (k === 'sub') { const n = peek.path[peek.path.length - 1].children.nodes.get(b.dataset.id); if (n) { peek.path.push(n); renderPeek(false); } }
      else if (k === 'tree') {
        HX.panes.setLs(true); $('secTree').classList.remove('is-closed');
        const it = document.querySelector('[data-tn="' + peek.path[peek.path.length - 1].id + '"]');
        if (it) { it.scrollIntoView({ block: 'nearest' }); it.classList.add('is-ping'); setTimeout(() => it.classList.remove('is-ping'), 900); }
      }
    });
    $('nestCard').addEventListener('click', e => {
      const b = e.target.closest('[data-nest]'); if (!b) return;
      if (b.dataset.nest === 'up') HX.goto(S.stack.length - 2);
      else { parentMin = !parentMin; renderParent(); }
    });
    $('nestTree').addEventListener('click', e => {
      const pv = e.target.closest('[data-tp]');
      if (pv) { e.stopPropagation(); const n = HX.findNode(pv.dataset.tp); if (n) openPeek(n, HX.cur().nodes.has(n.id) ? n : null); return; }
      const b = e.target.closest('[data-tn]'); if (!b) return;
      go(b.dataset.tn === 'root' ? null : HX.findNode(b.dataset.tn));
    });
    document.addEventListener('keydown', e => {
      const ae = document.activeElement, typing = /INPUT|TEXTAREA|SELECT/.test(ae.tagName) || ae.isContentEditable;
      if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
      if (peek) {
        if (e.key === 'Escape') { e.preventDefault(); e.stopImmediatePropagation(); closePeek(); }
        else if (e.key === 'Enter') { e.preventDefault(); e.stopImmediatePropagation(); enterPeek(); }
        return;
      }
      if (e.key === 'p' || e.key === 'P') {
        const n = [...S.sel].map(id => HX.cur().nodes.get(id)).find(x => x && x.children);
        if (n) { e.preventDefault(); openPeek(n); }
      }
    }, true);
    HX.on('op', () => { renderTree(); if (peek) renderPeek(false); });
    setInterval(() => {
      renderTree();
      if (peek) { drawPeek(); const st = $('peek').querySelector('.hx-peek__st'), n = peek.path[peek.path.length - 1]; if (st && !st.classList.contains('is-' + n.status)) { st.className = 'hx-badge hx-peek__st is-' + n.status; st.textContent = statusTxt(n); } }
      if (S.stack.length > 1) drawParent();
    }, 400);
    renderTree(true); renderParent();
  };
})(window.HX);

/* ---- 布局demo_v0.4/src/30_layout.js ---- */

/* ===== 30_layout.js · v0.4 布局：画布常驻中间、左右侧栏、底部居中对话框、浮动回复、主题、压力测试、初始化 =====

(function (HX) {
  'use strict';

  Object.assign(HX.UI, {

  /* ---------------- 画布常驻：没有「卡片 ↔ 展开」，S.open 恒为真 ---------------- */
  HX.drawCard = function () { /* v0.4 布局没有对话卡片缩略图 */ };
  HX.open = function () { /* 画布常驻 */ };
  HX.close = function () { if (rsOpen()) setRs(false); };

  /* 适应视图时只避开画布内的浮动件：顶部停靠栏、底部对话框（侧栏不压在画布上） */
  HX.fitTarget = function (ids, maxK) {
    const b = HX.bounds(HX.cur(), ids);
